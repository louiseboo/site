    const expandedProductGroupKeys = new Set();
    const collapsedProductGroupKeys = new Set();
    let groupingSourceKey = "";
    let cloudbaseAdminCode = sessionStorage.getItem("categorylabCloudbaseAdminCode") || "";

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", " ");
    }

    function nl(value) {
      return escapeHtml(value).replace(/\n/g, "<br>");
    }

    function compactText(value, fallback = "-") {
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    function dateText(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function relativeTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const diff = Date.now() - date.getTime();
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return "刚刚";
      if (minutes < 60) return `${minutes} 分钟前`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天前`;
      return `${date.getMonth() + 1}/${String(date.getDate()).padStart(2, "0")}`;
    }

    function roleCanEdit() {
      return ["owner", "pm"].includes(profile?.role);
    }

    function cloudbaseImageUrl(fileID) {
      if (!fileID || !cloudbaseConfig.apiUrl) return "";
      const url = new URL(cloudbaseConfig.apiUrl);
      url.searchParams.set("action", "image");
      url.searchParams.set("fileID", fileID);
      return url.toString();
    }

    function imageUrls(row) {
      return Array.isArray(row.image_paths)
        ? row.image_paths.map(image => cloudbaseImageUrl(image.fileID) || image.publicUrl || image.url).filter(Boolean)
        : [];
    }

    async function cloudbaseRequest(action, payload = {}) {
      const response = await fetch(cloudbaseConfig.apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CategoryLab-Admin-Code": cloudbaseAdminCode
        },
        body: JSON.stringify({ action, adminCode: cloudbaseAdminCode, ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || `请求失败（${response.status}）`);
      }
      return result.data;
    }

    function optionHtml(options, selected) {
      return options.map(option => `<option value="${escapeAttr(option)}" ${option === selected ? "selected" : ""}>${escapeHtml(option || "请选择")}</option>`).join("");
    }

    function fieldInput(field, value, placeholder = "", type = "text") {
      return `<input data-field="${escapeAttr(field)}" type="${escapeAttr(type)}" value="${escapeAttr(value || "")}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>`;
    }

    function fieldTextarea(field, value, placeholder = "", rows = 3) {
      return `<textarea data-field="${escapeAttr(field)}" rows="${rows}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>${escapeHtml(value || "")}</textarea>`;
    }

    function fieldSelect(field, options, selected) {
      return `<select data-field="${escapeAttr(field)}" ${roleCanEdit() ? "" : "disabled"}>${optionHtml(options, selected || "")}</select>`;
    }

    function fieldBlock(label, control, extraClass = "") {
      return `<label class="field-label ${extraClass}"><span>${escapeHtml(label)}</span>${control}</label>`;
    }

    function kv(label, value) {
      return `<div class="kv-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(compactText(value))}</b></div>`;
    }

    function editableKv(label, field, value, placeholder = "", type = "text") {
      return `<div class="kv-item"><label>${escapeHtml(label)}</label>${fieldInput(field, value, placeholder, type)}</div>`;
    }

    function categoryLabData() {
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function campaignOptions() {
      return ["", ...CAMPAIGN_OPTIONS];
    }

    function isImportedToCategoryLab(row) {
      const data = categoryLabData();
      const devRecords = Array.isArray(data?.devRecords) ? data.devRecords : [];
      return devRecords.some(item => item.supplierSubmissionId === row.id || item.id === `supplier-${row.id}`);
    }

    function normalizeGroupingText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[\s\p{P}\p{S}]+/gu, "");
    }

    function automaticProductKey(row = {}) {
      return `${normalizeGroupingText(row.supplier_name)}::${normalizeGroupingText(row.product_name)}`;
    }

    function groupingTime(row = {}) {
      const value = new Date(row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function groupingUpdateTime(row = {}) {
      const value = new Date(row.updated_at || row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function groupingVersionNumber(row = {}) {
      const match = String(row.version_label || "").trim().match(/^v\s*(\d+)$/i);
      return match ? Number(match[1]) : NaN;
    }

    function compareVersions(a = {}, b = {}) {
      const aVersion = groupingVersionNumber(a);
      const bVersion = groupingVersionNumber(b);
      const aKnown = Number.isFinite(aVersion);
      const bKnown = Number.isFinite(bVersion);
      if (aKnown !== bKnown) return aKnown ? -1 : 1;
      if (aKnown && aVersion !== bVersion) return aVersion - bVersion;
      const timeDifference = groupingTime(a) - groupingTime(b);
      if (timeDifference) return timeDifference;
      return String(a.id || "").localeCompare(String(b.id || ""));
    }

    function manualGroupAliases(allRecords = []) {
      const aliases = new Map();
      (allRecords || []).forEach(row => {
        const groupId = String(row.product_group_id || "").trim();
        if (!groupId) return;
        const supplier = normalizeGroupingText(row.supplier_name);
        const name = normalizeGroupingText(row.product_name);
        if (!supplier || !name) return;
        const entry = aliases.get(groupId) || { supplier, names: new Set() };
        if (entry.supplier === supplier) entry.names.add(name);
        aliases.set(groupId, entry);
      });
      return aliases;
    }

    function effectiveProductGroupKey(row = {}, allRecords = []) {
      const groupId = String(row.product_group_id || "").trim();
      if (groupId) return `manual:${groupId}`;
      const supplier = normalizeGroupingText(row.supplier_name);
      const name = normalizeGroupingText(row.product_name);
      if (supplier && name) {
        const matchingManualGroups = [];
        manualGroupAliases(allRecords).forEach((entry, id) => {
          if (entry.supplier === supplier && entry.names.has(name)) matchingManualGroups.push(id);
        });
        if (matchingManualGroups.length === 1) return `manual:${matchingManualGroups[0]}`;
      }
      return `auto:${automaticProductKey(row)}`;
    }

    function buildProductGroups(allRecords = [], matchingRecords = allRecords, identityRecords = allRecords) {
      const matchingIds = new Set((matchingRecords || []).map(row => row.id));
      const groups = new Map();
      (allRecords || []).forEach(row => {
        const key = effectiveProductGroupKey(row, identityRecords);
        const group = groups.get(key) || { key, records: [], matchingIds: new Set() };
        group.records.push(row);
        if (matchingIds.has(row.id)) group.matchingIds.add(row.id);
        groups.set(key, group);
      });
      return Array.from(groups.values())
        .filter(group => group.matchingIds.size > 0)
        .map(group => {
          group.records.sort(compareVersions);
          group.latest = [...group.records].sort((a, b) => groupingTime(b) - groupingTime(a))[0] || {};
          group.supplier = group.latest.supplier_name || group.records[0]?.supplier_name || "";
          group.name = group.latest.product_name || group.records[0]?.product_name || "";
          group.productGroupId = group.key.startsWith("manual:") ? group.key.slice(7) : "";
          group.pendingCount = group.records.filter(row => row.status !== "已确认").length;
          group.confirmedCount = group.records.filter(row => row.status === "已确认").length;
          return group;
        });
    }

    function buildVisibleProductGroups(allRecords = [], tabRecords = allRecords, matchingRecords = tabRecords) {
      return buildProductGroups(tabRecords, matchingRecords, allRecords);
    }

    function groupingBigrams(value) {
      const text = normalizeGroupingText(value);
      if (text.length < 2) return new Set(text ? [text] : []);
      const result = new Set();
      for (let index = 0; index < text.length - 1; index += 1) result.add(text.slice(index, index + 2));
      return result;
    }

    function productSimilarity(a, b) {
      const left = normalizeGroupingText(a);
      const right = normalizeGroupingText(b);
      if (!left || !right || left === right) return { score: left && left === right ? 1 : 0, isCandidate: false, reason: "" };
      const shorter = left.length <= right.length ? left : right;
      const longer = left.length > right.length ? left : right;
      const contains = shorter.length >= 4 && longer.includes(shorter);
      const leftBigrams = groupingBigrams(left);
      const rightBigrams = groupingBigrams(right);
      let intersection = 0;
      leftBigrams.forEach(token => { if (rightBigrams.has(token)) intersection += 1; });
      const dice = leftBigrams.size + rightBigrams.size
        ? (2 * intersection) / (leftBigrams.size + rightBigrams.size)
        : 0;
      const score = contains ? Math.max(0.9, dice) : dice;
      return {
        score,
        isCandidate: contains || dice >= 0.68,
        reason: contains ? "名称包含" : dice >= 0.68 ? "名称相似" : ""
      };
    }

    function suggestProductGroups(sourceGroup, groups = []) {
      if (!sourceGroup) return [];
      const sourceSupplier = normalizeGroupingText(sourceGroup.supplier);
      const sourceNames = [...new Set(sourceGroup.records.map(row => row.product_name).filter(Boolean))];
      return (groups || [])
        .filter(group => group.key !== sourceGroup.key && normalizeGroupingText(group.supplier) === sourceSupplier)
        .map(group => {
          const targetNames = [...new Set(group.records.map(row => row.product_name).filter(Boolean))];
          let best = { score: 0, isCandidate: false, reason: "" };
          sourceNames.forEach(source => targetNames.forEach(target => {
            const similarity = productSimilarity(source, target);
            if (similarity.score > best.score) best = similarity;
          }));
          return { group, ...best };
        })
        .filter(item => item.isCandidate)
        .sort((a, b) => b.score - a.score || groupingTime(b.group.latest) - groupingTime(a.group.latest))
        .slice(0, 3);
    }

    function recordVersionNumber(row = {}) {
      const match = String(row.version_label || "").trim().match(/^v\s*(\d+)$/i);
      return match ? Number(match[1]) : NaN;
    }

    function recordSequenceTime(row = {}) {
      const value = new Date(row.created_at || 0).getTime();
      return Number.isNaN(value) ? 0 : value;
    }

    function compareRecordSequence(a = {}, b = {}) {
      const aVersion = recordVersionNumber(a);
      const bVersion = recordVersionNumber(b);
      if (Number.isFinite(aVersion) && Number.isFinite(bVersion) && aVersion !== bVersion) return aVersion - bVersion;
      const timeDifference = recordSequenceTime(a) - recordSequenceTime(b);
      if (timeDifference) return timeDifference;
      return String(a.id || "").localeCompare(String(b.id || ""));
    }

    function deriveVersionStage(row = {}, allRecords = []) {
      const milestoneStages = {
        "通过且进入众测": "众测版",
        "通过且进入中试": "中试版",
        "通过且进入大生产": "大生产版"
      };
      if (milestoneStages[row.round_conclusion]) return milestoneStages[row.round_conclusion];

      const optimizationRules = {
        "众测后优化": { conclusion: "通过且进入众测", stage: "众测优化版" },
        "中试后优化": { conclusion: "通过且进入中试", stage: "中试优化版" },
        "上市后优化": { conclusion: "通过且进入大生产", stage: "大生产优化版" }
      };
      const rule = optimizationRules[row.tasting_scene];
      const identity = effectiveProductGroupKey(row, allRecords);
      if (!rule || identity === "auto:::") return "";
      const hasPriorMilestone = (allRecords || []).some(candidate =>
        candidate.id !== row.id &&
        effectiveProductGroupKey(candidate, allRecords) === identity &&
        compareRecordSequence(candidate, row) < 0 &&
        candidate.round_conclusion === rule.conclusion
      );
      return hasPriorMilestone ? rule.stage : "";
    }

    function createdTime(row) {
      const time = new Date(row.created_at || 0).getTime();
      return Number.isNaN(time) ? 0 : time;
    }

    function optionRank(options, value) {
      const index = options.indexOf(String(value || "").trim());
      return index >= 0 ? index : options.length + 1;
    }

    function compareSubmittedDesc(a, b) {
      return createdTime(b) - createdTime(a);
    }

    function sortRecords(rows) {
      const sorted = [...rows];
      if (sortMode === "category") {
        return sorted.sort((a, b) =>
          optionRank(PRODUCT_TYPE_ORDER, a.product_type) - optionRank(PRODUCT_TYPE_ORDER, b.product_type) ||
          compareSubmittedDesc(a, b)
        );
      }
      if (sortMode === "campaign") {
        return sorted.sort((a, b) =>
          optionRank(CAMPAIGN_OPTIONS, a.campaign) - optionRank(CAMPAIGN_OPTIONS, b.campaign) ||
          compareSubmittedDesc(a, b)
        );
      }
      return sorted.sort(compareSubmittedDesc);
    }

    function recordMatchesStatusFilter(row, filter = statusFilter) {
      return filter === "已导入"
        ? isImportedToCategoryLab(row)
        : (!filter || row.status === filter);
    }

    function visibleRecords() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = records.filter(row => {
        const haystack = [
          row.product_name,
          row.supplier_name,
          row.version_label,
          deriveVersionStage(row, records),
          row.product_type,
          row.test_category,
          row.campaign,
          row.version_change,
          row.finished_spec,
          row.length_mm,
          row.width_mm,
          row.height_mm,
          row.ingredients_structure,
          row.core_ingredients_selling_points,
          row.tasting_feedback,
          row.next_step_direction,
          row.key_blocker
        ].join(" ").toLowerCase();
        return recordMatchesStatusFilter(row) && (!q || haystack.includes(q));
      });
      return sortRecords(filtered);
    }

    function latestGroupValue(group, field) {
      return [...(group.records || [])]
        .sort((a, b) => groupingUpdateTime(b) - groupingUpdateTime(a))
        .find(row => String(row[field] || "").trim())?.[field] || "";
    }

    function visibleProductGroups() {
      const matchingRecords = visibleRecords();
      const tabRecords = records.filter(row => recordMatchesStatusFilter(row));
      const groups = buildVisibleProductGroups(records, tabRecords, matchingRecords);
      if (sortMode === "category") {
        return groups.sort((a, b) =>
          optionRank(PRODUCT_TYPE_ORDER, latestGroupValue(a, "product_type")) - optionRank(PRODUCT_TYPE_ORDER, latestGroupValue(b, "product_type")) ||
          groupingTime(b.latest) - groupingTime(a.latest)
        );
      }
      if (sortMode === "campaign") {
        return groups.sort((a, b) =>
          optionRank(CAMPAIGN_OPTIONS, latestGroupValue(a, "campaign")) - optionRank(CAMPAIGN_OPTIONS, latestGroupValue(b, "campaign")) ||
          groupingTime(b.latest) - groupingTime(a.latest)
        );
      }
      return groups.sort((a, b) => groupingTime(b.latest) - groupingTime(a.latest));
    }

    function testCategorySectionKey(group) {
      const category = String(latestGroupValue(group, "test_category") || "").trim();
      if (category === "档期测试") return "campaign";
      if (category === "新品提案") return "proposal";
      return "uncategorized";
    }

    function compareCampaignLaunchOrder(a, b, campaignOptions = CAMPAIGN_OPTIONS) {
      const campaignDifference = optionRank(campaignOptions, latestGroupValue(a, "campaign"))
        - optionRank(campaignOptions, latestGroupValue(b, "campaign"));
      if (campaignDifference) return campaignDifference;
      return groupingTime(b.latest) - groupingTime(a.latest);
    }

    function buildTestCategorySections(groups = [], filter = statusFilter, campaignOptions = CAMPAIGN_OPTIONS) {
      if (!["待处理", "已确认"].includes(filter)) {
        return [{ key: "all", label: "", note: "", groups: [...groups] }];
      }
      const definitions = [
        { key: "campaign", label: "档期测试" },
        { key: "proposal", label: "新品提案" },
        { key: "uncategorized", label: "未分类" }
      ];
      const buckets = new Map(definitions.map(definition => [definition.key, []]));
      groups.forEach(group => buckets.get(testCategorySectionKey(group)).push(group));
      return definitions
        .map(definition => {
          const sectionGroups = [...buckets.get(definition.key)];
          if (filter === "已确认" && definition.key === "campaign") {
            sectionGroups.sort((a, b) => compareCampaignLaunchOrder(a, b, campaignOptions));
          }
          return {
            ...definition,
            note: filter === "已确认" && definition.key === "campaign" ? "按上市顺序" : "",
            groups: sectionGroups
          };
        })
        .filter(section => section.groups.length > 0);
    }

    function recordById(id) {
      return records.find(row => row.id === id) || null;
    }

    function activeRecord() {
      return recordById(activeRecordId);
    }

    function activeProductGroup() {
      return buildProductGroups(records, records).find(group => group.records.some(row => row.id === activeRecordId)) || null;
    }

    function activeVisibleProductGroup() {
      return visibleProductGroups().find(group => group.records.some(row => row.id === activeRecordId)) || null;
    }

    function visibleProductSections() {
      return buildTestCategorySections(visibleProductGroups());
    }

    function visibleProductGroupsInDisplayOrder() {
      return visibleProductSections().flatMap(section => section.groups);
    }

    function syncUrl() {
      const url = new URL(location.href);
      url.searchParams.delete("id");
      history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
    }

    function ensureActive(preferredId = activeRecordId) {
      const groups = visibleProductGroupsInDisplayOrder();
      const availableRows = groups.flatMap(group => group.records);
      if (preferredId && availableRows.some(row => row.id === preferredId)) {
        activeRecordId = preferredId;
      } else {
        const matchingRows = visibleRecords();
        const preferredRows = searchInput.value.trim() ? matchingRows : availableRows;
        activeRecordId = preferredRows[0]?.id || availableRows[0]?.id || matchingRows[0]?.id || "";
      }
      syncUrl();
    }

    function productGroupExpanded(key, activeKey, expandedKeys = expandedProductGroupKeys, collapsedKeys = collapsedProductGroupKeys) {
      return expandedKeys.has(key) || (key === activeKey && !collapsedKeys.has(key));
    }

    function setProductGroupExpanded(key, shouldExpand, expandedKeys = expandedProductGroupKeys, collapsedKeys = collapsedProductGroupKeys) {
      if (shouldExpand) {
        collapsedKeys.delete(key);
        expandedKeys.add(key);
      } else {
        expandedKeys.delete(key);
        collapsedKeys.add(key);
      }
    }

    function shouldShowProcessingStatus(filter = statusFilter) {
      return !filter;
    }

    function renderCounts() {
      const pending = records.filter(row => row.status === "待处理").length;
      const confirmed = records.filter(row => row.status === "已确认").length;
      const imported = records.filter(row => isImportedToCategoryLab(row)).length;
      countEls.pending.textContent = pending;
      countEls.confirmed.textContent = confirmed;
      countEls.imported.textContent = imported;
      countEls.all.textContent = records.length;
      document.querySelectorAll("[data-status-filter]").forEach(button => {
        button.classList.toggle("active", button.dataset.statusFilter === statusFilter);
      });
    }

    function submissionNumber(row) {
      const group = buildProductGroups(records, records).find(item => item.records.some(candidate => candidate.id === row.id));
      return Math.max(1, (group?.records || []).findIndex(item => item.id === row.id) + 1);
    }

    function statusClass(row) {
      return row.status === "已确认" ? "confirmed" : "pending";
    }

    function versionStageBadge(stage) {
      return stage ? `<span class="version-stage-badge">${escapeHtml(stage)}</span>` : "";
    }

    function productGroupListHtml(group, sectionKey, activeGroupKey, showProcessingStatus) {
      const isActiveGroup = group.key === activeGroupKey;
      const isExpanded = productGroupExpanded(group.key, activeGroupKey);
      const statusParts = [
        group.pendingCount ? `${group.pendingCount} 待处理` : "",
        group.confirmedCount ? `${group.confirmedCount} 已确认` : ""
      ].filter(Boolean).join(" · ");
      const confirmedCampaign = statusFilter === "已确认" && sectionKey === "campaign";
      const campaignText = confirmedCampaign
        ? ` · 档期：${compactText(latestGroupValue(group, "campaign"), "未选择")}`
        : "";
      return `
        <section class="product-group ${isActiveGroup ? "active" : ""} ${isExpanded ? "" : "collapsed"}" data-product-group-key="${escapeAttr(group.key)}">
          <button class="product-group-head" data-product-group-toggle="${escapeAttr(group.key)}" type="button" aria-expanded="${isExpanded}">
            <span class="product-group-title-row">
              <span class="product-group-title">${escapeHtml(compactText(group.name, "未命名产品"))}</span>
              <span class="product-group-caret">▼</span>
            </span>
            <span class="product-group-meta-row">
              <span>${escapeHtml(compactText(group.supplier, "未知供应商"))} · ${group.records.length} 个版本 · ${escapeHtml(relativeTime(group.latest.created_at))}${escapeHtml(campaignText)}</span>
              ${showProcessingStatus && statusParts ? `<span class="product-group-status">处理状态：${escapeHtml(statusParts)}</span>` : ""}
            </span>
          </button>
          <div class="product-version-list">
            ${group.records.map(row => {
              const stage = deriveVersionStage(row, records);
              const matchesFilter = group.matchingIds.has(row.id);
              return `
                <button class="version-item ${row.id === activeRecordId ? "active" : ""} ${matchesFilter ? "" : "filter-muted"}" data-record-id="${escapeAttr(row.id)}" type="button">
                  <span class="version-item-head">
                    <span class="version-item-version">${escapeHtml(compactText(row.version_label, "未填版本"))}${stage ? versionStageBadge(stage) : ""}</span>
                    <span class="item-time">${escapeHtml(relativeTime(row.created_at))}</span>
                  </span>
                  <span class="version-item-meta">
                    ${showProcessingStatus ? `<span class="status-word ${statusClass(row)}">处理状态：${escapeHtml(row.status || "待处理")}</span>` : ""}
                    <span>${escapeHtml(compactText(row.product_type || row.test_category, "未分类"))}</span>
                  </span>
                  <span class="version-item-summary">${escapeHtml(compactText(row.version_change || row.core_ingredients_selling_points || row.ingredients_structure, "暂无摘要"))}</span>
                </button>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    function renderList() {
      const groups = visibleProductGroupsInDisplayOrder();
      if (!groups.length) {
        listEl.innerHTML = `<div class="empty-list">暂无匹配记录。</div>`;
        return;
      }
      const sections = visibleProductSections();
      const activeGroupKey = activeProductGroup()?.key || "";
      const showProcessingStatus = shouldShowProcessingStatus();
      listEl.innerHTML = sections.map(section => {
        const recordCount = section.groups.reduce((total, group) => total + group.records.length, 0);
        const sectionBar = section.label ? `
          <header class="test-category-bar ${section.key}-section" data-test-category-section="${escapeAttr(section.key)}">
            <span class="test-category-title">${escapeHtml(section.label)}</span>
            <span class="test-category-meta">
              ${section.note ? `<span class="test-category-note">${escapeHtml(section.note)}</span>` : ""}
              <span>${section.groups.length} 个产品 · ${recordCount} 条记录</span>
            </span>
          </header>
        ` : "";
        return `
          <section class="test-category-section ${section.key}-category-section">
            ${sectionBar}
            ${section.groups.map(group => productGroupListHtml(group, section.key, activeGroupKey, showProcessingStatus)).join("")}
          </section>
        `;
      }).join("");
    }

    function renderVersionSwitcher(row) {
      const group = activeVisibleProductGroup();
      if (!group || group.records.length < 2) return "";
      return `
        <nav class="version-switcher" aria-label="切换产品版本">
          ${group.records.map(candidate => {
            const stage = deriveVersionStage(candidate, records);
            return `
              <button class="version-switch-button ${candidate.id === row.id ? "active" : ""}" data-version-record-id="${escapeAttr(candidate.id)}" type="button">
                <span>${escapeHtml(compactText(candidate.version_label, "未填版本"))}</span>
                ${stage ? versionStageBadge(stage) : ""}
              </button>
            `;
          }).join("")}
        </nav>
      `;
    }

    function allProductGroups() {
      return buildProductGroups(records, records).sort((a, b) => groupingTime(b.latest) - groupingTime(a.latest));
    }

    function productGroupByKey(key) {
      return allProductGroups().find(group => group.key === key) || null;
    }

    function groupingTargetHtml(item, suggested = false) {
      const group = item.group || item;
      const reason = item.reason || "";
      return `
        <button class="grouping-target" data-merge-product-group-key="${escapeAttr(group.key)}" type="button">
          <span class="grouping-target-copy">
            <b>${escapeHtml(compactText(group.name, "未命名产品"))}</b>
            <span>${escapeHtml(compactText(group.supplier, "未知供应商"))} · ${group.records.length} 个版本 · ${group.records.map(row => row.version_label || "未填版本").join(" / ")}</span>
          </span>
          ${suggested ? `<span class="grouping-reason">${escapeHtml(reason || "名称相似")}</span>` : ""}
        </button>
      `;
    }

    function renderProductGroupingCandidates() {
      const source = productGroupByKey(groupingSourceKey);
      if (!source) {
        productGroupCandidates.innerHTML = `<p class="grouping-empty">当前产品组已发生变化，请关闭后重试。</p>`;
        return;
      }
      const allGroups = allProductGroups();
      const suggestions = suggestProductGroups(source, allGroups);
      const suggestedKeys = new Set(suggestions.map(item => item.group.key));
      const query = normalizeGroupingText(productGroupSearch.value);
      const sameSupplier = allGroups.filter(group =>
        group.key !== source.key &&
        normalizeGroupingText(group.supplier) === normalizeGroupingText(source.supplier) &&
        (!query || normalizeGroupingText(`${group.name} ${group.records.map(row => row.product_name).join(" ")}`).includes(query))
      );
      const otherGroups = sameSupplier.filter(group => !suggestedKeys.has(group.key));
      productGroupCandidates.innerHTML = `
        <section class="grouping-section">
          <h3>可能属于同一产品</h3>
          <div class="grouping-target-list">
            ${suggestions.length ? suggestions.map(item => groupingTargetHtml(item, true)).join("") : `<p class="grouping-empty">暂未识别到相似名称，可在下方搜索同一供应商的其他产品。</p>`}
          </div>
        </section>
        <section class="grouping-section">
          <h3>同一供应商的其他产品</h3>
          <div class="grouping-target-list">
            ${otherGroups.length ? otherGroups.map(group => groupingTargetHtml(group)).join("") : `<p class="grouping-empty">没有其他匹配产品组。</p>`}
          </div>
        </section>
      `;
      const detachButton = productGroupModal.querySelector("[data-detach-current-version]");
      const restoreButton = productGroupModal.querySelector("[data-restore-auto-grouping]");
      detachButton.disabled = source.records.length < 2;
      restoreButton.disabled = !source.records.some(row => String(row.product_group_id || "").trim());
    }

    function openProductGroupingModal() {
      const source = activeProductGroup();
      if (!source) return;
      groupingSourceKey = source.key;
      productGroupCurrent.textContent = `${compactText(source.name, "未命名产品")} · ${compactText(source.supplier, "未知供应商")} · ${source.records.length} 个版本`;
      productGroupSearch.value = "";
      renderProductGroupingCandidates();
      productGroupModal.classList.remove("hidden");
      productGroupSearch.focus();
    }

    function closeProductGroupingModal() {
      productGroupModal.classList.add("hidden");
      groupingSourceKey = "";
    }

    async function setProductGroup(recordIds, productGroupId) {
      if (!roleCanEdit()) throw new Error("当前账号没有修改权限。");
      if (!cloudbaseReady) throw new Error("产品归组目前仅支持腾讯云收件箱。");
      const data = await cloudbaseRequest("adminSetProductGroup", { recordIds, productGroupId });
      (data.records || []).forEach(updated => {
        const index = records.findIndex(row => row.id === updated.id);
        if (index >= 0) records[index] = updated;
      });
      return data.records || [];
    }

    async function mergeProductGroups(targetKey) {
      const source = productGroupByKey(groupingSourceKey);
      const target = productGroupByKey(targetKey);
      if (!source || !target) throw new Error("产品组已发生变化，请刷新后重试。");
      const confirmed = window.confirm(`确认将“${source.name}”的 ${source.records.length} 个版本归入“${target.name}”？\n各版本仍保留为独立记录。`);
      if (!confirmed) return;
      const productGroupId = target.productGroupId || source.productGroupId || `pg-${crypto.randomUUID()}`;
      const recordIds = [...new Set([...source.records, ...target.records].map(row => row.id))];
      await setProductGroup(recordIds, productGroupId);
      closeProductGroupingModal();
      renderAll(activeRecordId);
      showMessage("产品版本已归入同一产品组，各版本记录保持独立。", "success");
    }

    async function detachCurrentVersion() {
      const source = productGroupByKey(groupingSourceKey);
      const row = activeRecord();
      if (!source || !row || source.records.length < 2) return;
      const confirmed = window.confirm(`确认将 ${row.version_label || "当前版本"} 从“${source.name}”移出并建立独立产品组？`);
      if (!confirmed) return;
      await setProductGroup([row.id], `pg-${crypto.randomUUID()}`);
      closeProductGroupingModal();
      renderAll(row.id);
      showMessage("当前版本已移出并建立独立产品组。", "success");
    }

    async function restoreAutomaticGrouping() {
      const source = productGroupByKey(groupingSourceKey);
      if (!source || !source.records.some(row => String(row.product_group_id || "").trim())) return;
      const confirmed = window.confirm(`确认清除“${source.name}”的人工归组关系，并重新按供应商和品名自动归组？`);
      if (!confirmed) return;
      await setProductGroup(source.records.map(row => row.id), null);
      closeProductGroupingModal();
      renderAll(activeRecordId);
      showMessage("已恢复按供应商和品名自动归组。", "success");
    }

    function renderImageStrip(row) {
      const imgs = imageUrls(row);
      if (!imgs.length) return "";
      return `
        <div class="image-strip">
          ${imgs.map((url, index) => `
            <button class="image-button ${index === 0 ? "main" : ""}" data-image-url="${escapeAttr(url)}" type="button">
              <img src="${escapeAttr(url)}" alt="产品照 ${index + 1}">
            </button>
          `).join("")}
        </div>
      `;
    }

    function sectionHtml(title, value, className = "") {
      const text = String(value || "").trim();
      if (!text) return "";
      return `<section class="section-block ${className}"><h3>${escapeHtml(title)}</h3><p class="section-copy">${nl(text)}</p></section>`;
    }

    function factItem(label, value) {
      return `<div class="fact-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(compactText(value))}</b></div>`;
    }

    function renderSupplierEditPanel(row) {
      if (!supplierEditOpen) return "";
      return `
        <div class="supplier-edit-panel">
          <div class="edit-grid">
            ${fieldBlock("供应商", fieldInput("supplier_name", row.supplier_name, "供应商"))}
            ${fieldBlock("品名", fieldInput("product_name", row.product_name, "品名"))}
            ${fieldBlock("版本", fieldInput("version_label", row.version_label, "V1 / V2 / V3"))}
            ${fieldBlock("产品规格（g）", fieldInput("finished_spec", row.finished_spec, "如：165/份、单个规格、包装规格"))}
            ${fieldBlock("长度（mm）", fieldInput("length_mm", row.length_mm, "填写数字"))}
            ${fieldBlock("宽度（mm）", fieldInput("width_mm", row.width_mm, "填写数字"))}
            ${fieldBlock("高度（mm）", fieldInput("height_mm", row.height_mm, "填写数字"))}
            ${fieldBlock("类型", fieldSelect("product_type", ["", "烘焙", "蛋糕", "三明治", "预包装食品"], row.product_type))}
            ${fieldBlock("测试类别", fieldSelect("test_category", ["", "档期测试", "新品提案"], row.test_category))}
            ${fieldBlock("送样时间", fieldInput("sample_date", row.sample_date, "YYYY-MM-DD", "date"))}
            ${fieldBlock("本版调整点", fieldTextarea("version_change", row.version_change, "本版调整点", 3), "span-2")}
            ${fieldBlock("产品结构", fieldTextarea("ingredients_structure", row.ingredients_structure, "产品结构", 3), "span-2")}
            ${fieldBlock("核心原料及卖点", fieldTextarea("core_ingredients_selling_points", row.core_ingredients_selling_points, "核心原料及卖点", 3), "span-2")}
          </div>
        </div>
      `;
    }

    function renderSupplierBlock(row) {
      const versionStage = deriveVersionStage(row, records);
      return `
        <section class="supplier-block">
          <div class="supplier-head">
            <h3>供应商提交内容</h3>
            <button class="supplier-edit-toggle" data-toggle-supplier-edit type="button" ${roleCanEdit() ? "" : "disabled"}>${supplierEditOpen ? "收起校准" : "编辑供应商信息"}</button>
          </div>
          <div class="supplier-facts">
            ${factItem("供应商", row.supplier_name)}
            ${factItem("品名", row.product_name)}
            ${factItem("版本", row.version_label)}
            ${versionStage ? factItem("版本阶段", versionStage) : ""}
            ${factItem("产品规格（g）", row.finished_spec)}
            ${factItem("长度（mm）", row.length_mm)}
            ${factItem("宽度（mm）", row.width_mm)}
            ${factItem("高度（mm）", row.height_mm)}
            ${factItem("类型", row.product_type)}
            ${factItem("测试类别", row.test_category)}
            ${factItem("送样时间", row.sample_date)}
          </div>
          ${sectionHtml("本版调整点", row.version_change)}
          ${sectionHtml("产品结构", row.ingredients_structure)}
          ${sectionHtml("核心原料及卖点", row.core_ingredients_selling_points)}
          ${renderSupplierEditPanel(row)}
        </section>
      `;
    }

    function renderDetail() {
      const row = activeRecord();
      if (!row) {
        detailPane.innerHTML = `<div class="empty-detail">请选择左侧记录。</div>`;
        metaPanel.innerHTML = "";
        return;
      }
      const badgeClass = statusClass(row);
      const versionStage = deriveVersionStage(row, records);
      detailPane.innerHTML = `
        <div class="detail-title-row">
          <h2>${escapeHtml(compactText(row.product_name, "未命名产品"))}</h2>
          <span class="status-badge ${badgeClass}">${escapeHtml(row.status || "待处理")}</span>
        </div>
        <p class="detail-meta">
          ${escapeHtml(compactText(row.supplier_name, "未知供应商"))}
          ${row.product_type ? `（${escapeHtml(row.product_type)}）` : ""}
          · ${escapeHtml(compactText(row.test_category, "未填测试类别"))}
          · ${escapeHtml(compactText(row.version_label, "未填版本"))}
          ${versionStage ? ` · ${versionStageBadge(versionStage)}` : ""}
          · ${escapeHtml(dateText(row.created_at))}
          · 第 ${submissionNumber(row)} 次提交
        </p>
        ${renderVersionSwitcher(row)}
        ${renderImageStrip(row)}
        ${renderSupplierBlock(row)}
        <section class="edit-panel">
          <h3>产品经理补充测试结果</h3>
          <div class="edit-grid">
            ${fieldBlock("报价（元，含税含运）", fieldInput("quote_rmb", row.quote_rmb, "线下确认后填写"))}
            ${fieldBlock("档期名称", fieldSelect("campaign", campaignOptions(row.campaign), row.campaign))}
            ${fieldBlock("测试场景 / 反馈来源", fieldSelect("tasting_scene", ["", "前期打磨测试", "众测后优化", "中试后优化", "上市后优化"], row.tasting_scene))}
            ${fieldBlock("本轮结论", fieldSelect("round_conclusion", ["", "继续调整", "暂停", "通过且储备", "通过且进入众测", "通过且进入中试", "通过且进入大生产"], row.round_conclusion))}
            <div class="version-stage-preview span-2" data-version-stage-preview>${versionStage ? `自动识别版本阶段：${escapeHtml(versionStage)}` : "尚未识别版本阶段。进入众测、中试或大生产后自动标记。"}</div>
            ${fieldBlock("测试反馈", fieldTextarea("tasting_feedback", row.tasting_feedback, "测试反馈", 4), "span-2")}
            ${fieldBlock("下一步改进方向", fieldTextarea("next_step_direction", row.next_step_direction, "下一步改进方向", 3), "span-2")}
            ${fieldBlock("关键卡点 / 备注", fieldTextarea("key_blocker", row.key_blocker, "关键卡点 / 备注", 3), "span-2")}
          </div>
        </section>
      `;
      renderMeta(row);
    }

    function renderMeta(row) {
      const imported = isImportedToCategoryLab(row);
      const versionStage = deriveVersionStage(row, records);
      const importText = imported ? "已导入 Category Lab" : "未导入 Category Lab";
      const importClass = imported ? "import-state ok" : row.status === "已确认" ? "import-state warn" : "import-state";
      metaPanel.innerHTML = `
        <div class="meta-actions">
          <button class="primary" data-confirm-active type="button" ${roleCanEdit() ? "" : "disabled"}>确认提交</button>
          <button data-save-active type="button" ${roleCanEdit() ? "" : "disabled"}>保存修改</button>
          <button data-import-active type="button" ${roleCanEdit() ? "" : "disabled"}>${imported ? "更新导入 Category Lab" : "导入 Category Lab"}</button>
          <button data-open-product-grouping type="button" ${roleCanEdit() ? "" : "disabled"}>调整产品归组</button>
          <button class="danger" data-delete-active type="button" ${roleCanEdit() ? "" : "disabled"}>删除记录</button>
        </div>
        <div class="meta-divider"></div>
        <div class="kv-list">
          ${kv("供应商", row.supplier_name)}
          ${kv("送样时间", row.sample_date)}
          ${kv("类型", row.product_type)}
          ${kv("测试类别", row.test_category)}
          ${kv("档期名称", row.campaign)}
          ${kv("版本", row.version_label)}
          ${versionStage ? kv("版本阶段", versionStage) : ""}
          ${kv("产品规格（g）", row.finished_spec)}
          ${kv("长度（mm）", row.length_mm)}
          ${kv("宽度（mm）", row.width_mm)}
          ${kv("高度（mm）", row.height_mm)}
          <div class="${importClass}">${escapeHtml(importText)}</div>
          ${kv("提交编号", row.followup_code)}
          ${kv("提交时间", dateText(row.created_at))}
          ${kv("更新时间", dateText(row.updated_at))}
        </div>
      `;
    }

    function renderAll(preferredId = activeRecordId) {
      renderCounts();
      ensureActive(preferredId);
      renderList();
      renderDetail();
    }

    function resetInMemoryState() {
      profile = null;
      records = [];
      activeRecordId = "";
      listEl.innerHTML = `<div class="empty-list">暂无数据。</div>`;
      detailPane.innerHTML = "";
      metaPanel.innerHTML = "";
      renderCounts();
    }

    function showLoginForm() {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.remove("hidden");
      sessionGate.classList.add("hidden");
      appPanel.classList.add("hidden");
    }

    function showSessionGate(session) {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.add("hidden");
      sessionGate.classList.remove("hidden");
      appPanel.classList.add("hidden");
      sessionGateText.textContent = `当前登录账号：${session?.user?.email || "内部账号"}。进入前请确认周围环境。`;
    }

    function showAppShell() {
      loginPanel.classList.add("hidden");
      appPanel.classList.remove("hidden");
    }

    async function logout() {
      if (cloudbaseReady) {
        sessionStorage.removeItem("categorylabCloudbaseAdminCode");
        cloudbaseAdminCode = "";
      } else if (client) {
        await client.auth.signOut();
      }
      clearMessage();
      showLoginForm();
      loginForm.elements.password.value = "";
      loginForm.elements.email.focus();
    }

    async function loadProfile(session) {
      if (cloudbaseReady) return;
      const { data, error } = await client
        .from("categorylab_profiles")
        .select("*")
        .eq("id", session.user.id)
        .single();
      if (error) throw error;
      profile = data;
    }

    async function loadRecords() {
      if (!profile) return;
      loadBtn.disabled = true;
      loadBtn.textContent = "读取中...";
      clearMessage();
      try {
        if (cloudbaseReady) {
          const data = await cloudbaseRequest("adminList");
          records = data.records || [];
        } else {
          const { data, error } = await client
            .from(TABLE)
            .select("*")
            .order("created_at", { ascending: false });
          if (error) throw error;
          records = data || [];
        }
        records.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
        lastRefreshText.textContent = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
        renderAll(activeRecordId);
        const missingImport = records.filter(row => row.status === "已确认" && !isImportedToCategoryLab(row)).length;
        if (missingImport > 0) showMessage(`有 ${missingImport} 条已确认记录还没有导入 Category Lab。`, "");
      } catch (error) {
        showMessage(error.message || "读取失败。", "error");
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = "刷新";
      }
    }

    async function boot({ unlock = false } = {}) {
      if (cloudbaseReady) {
        profile = { display_name: "Louise", role: "owner" };
        showAppShell();
        await loadRecords();
        return;
      }
      if (!supabaseReady) {
        showLoginForm();
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const { data } = await client.auth.getSession();
      if (!data.session) {
        showLoginForm();
        return;
      }
      if (!unlock) {
        showSessionGate(data.session);
        return;
      }
      await loadProfile(data.session);
      showAppShell();
      await loadRecords();
    }

    function detailValue(field, fallback = "") {
      const node = appPanel.querySelector(`[data-field="${CSS.escape(field)}"]`);
      return node ? node.value : String(fallback ?? "");
    }

    function activePayload() {
      const row = activeRecord() || {};
      const quoteText = detailValue("quote_rmb", row.quote_rmb ?? "").trim();
      const quoteCleaned = quoteText.replace(/[^0-9.]/g, "");
      const quote = Number(quoteCleaned);
      return {
        product_name: detailValue("product_name", row.product_name || "").trim() || row.product_name || "",
        supplier_name: detailValue("supplier_name", row.supplier_name || "").trim() || row.supplier_name || "",
        version_label: detailValue("version_label", row.version_label || "").trim(),
        sample_date: detailValue("sample_date", row.sample_date || "").trim() || null,
        product_type: detailValue("product_type", row.product_type || "").trim(),
        test_category: detailValue("test_category", row.test_category || "").trim(),
        campaign: detailValue("campaign", row.campaign || "").trim(),
        version_change: detailValue("version_change", row.version_change || "").trim(),
        finished_spec: detailValue("finished_spec", row.finished_spec || "").trim(),
        length_mm: detailValue("length_mm", row.length_mm || "").trim(),
        width_mm: detailValue("width_mm", row.width_mm || "").trim(),
        height_mm: detailValue("height_mm", row.height_mm || "").trim(),
        ingredients_structure: detailValue("ingredients_structure", row.ingredients_structure || "").trim(),
        quote_rmb: quoteCleaned && Number.isFinite(quote) ? quote : null,
        core_ingredients_selling_points: detailValue("core_ingredients_selling_points", row.core_ingredients_selling_points || "").trim(),
        tasting_scene: detailValue("tasting_scene", row.tasting_scene || ""),
        tasting_feedback: detailValue("tasting_feedback", row.tasting_feedback || "").trim(),
        round_conclusion: detailValue("round_conclusion", row.round_conclusion || ""),
        next_step_direction: detailValue("next_step_direction", row.next_step_direction || "").trim(),
        key_blocker: detailValue("key_blocker", row.key_blocker || "").trim(),
        status: row.status || "待处理"
      };
    }

    function updateVersionStagePreview() {
      const row = activeRecord();
      const preview = appPanel.querySelector("[data-version-stage-preview]");
      if (!row || !preview) return;
      const stage = deriveVersionStage({ ...row, ...activePayload() }, records);
      preview.textContent = stage
        ? `自动识别版本阶段：${stage}`
        : "尚未识别版本阶段。进入众测、中试或大生产后自动标记。";
    }

    async function saveRow(id = activeRecordId, override = {}) {
      if (!roleCanEdit() || !id) return null;
      const payload = { ...activePayload(), ...override };
      let data;
      if (cloudbaseReady) {
        const response = await cloudbaseRequest("adminUpdate", { id, payload });
        data = response.record;
      } else {
        const response = await client
          .from(TABLE)
          .update(payload)
          .eq("id", id)
          .select("*")
          .single();
        if (response.error) throw response.error;
        data = response.data;
      }
      const index = records.findIndex(row => row.id === id);
      if (index >= 0) records[index] = data;
      renderAll(id);
      return data;
    }

    async function confirmActiveRow(id = activeRecordId) {
      if (!roleCanEdit() || !id) return null;
      const updated = await saveRow(id, { status: "已确认" });
      statusFilter = "已确认";
      renderAll(id);
      return updated;
    }

    function categoryLabRecord(row) {
      const tastingSummary = [
        row.round_conclusion ? `本轮结论：${row.round_conclusion}` : "",
        row.tasting_feedback ? `测试反馈：${row.tasting_feedback}` : ""
      ].filter(Boolean).join("\n");
      return {
        id: `supplier-${row.id}`,
        time: row.created_at ? dateText(row.created_at) : new Date().toLocaleString("zh-CN"),
        category: row.product_type || "",
        campaign: row.campaign || "",
        project: row.product_name || "",
        supplier: row.supplier_name || "",
        brand: "",
        spec: row.finished_spec || "",
        price: row.quote_rmb || "",
        weight: "",
        length: row.length_mm || "",
        width: row.width_mm || "",
        height: row.height_mm || "",
        version: row.version_label || "V1",
        versionStage: deriveVersionStage(row, records),
        testDate: row.sample_date || "",
        type: "OEM 品类测试",
        images: imageUrls(row),
        image: imageUrls(row)[0] || "",
        overallEvaluation: tastingSummary,
        sensory: {
          appearance: "",
          appearanceScore: "",
          aroma: "",
          aromaScore: "",
          flavor: row.tasting_feedback || "",
          flavorScore: "",
          texture: "",
          textureScore: ""
        },
        materials: row.ingredients_structure || "",
        yield: {},
        note: row.next_step_direction || "",
        supplierSubmissionId: row.id,
        supplierSubmissionSummary: [
          row.followup_code ? `提交编号：${row.followup_code}` : "",
          row.product_type ? `产品类型：${row.product_type}` : "",
          row.test_category ? `测试类别：${row.test_category}` : "",
          row.campaign ? `档期名称：${row.campaign}` : "",
          row.length_mm || row.width_mm || row.height_mm ? `尺寸（mm）：长 ${row.length_mm || "-"} / 宽 ${row.width_mm || "-"} / 高 ${row.height_mm || "-"}` : "",
          row.version_change ? `本版调整点：${row.version_change}` : "",
          row.core_ingredients_selling_points ? `核心原料及卖点：${row.core_ingredients_selling_points}` : "",
          row.key_blocker ? `关键卡点 / 备注：${row.key_blocker}` : ""
        ].filter(Boolean).join("\n")
      };
    }

    async function importToCategoryLab(id = activeRecordId) {
      if (!roleCanEdit() || !id) return;
      const row = recordById(id);
      if (!row) return;
      const mergedRow = { ...row, ...activePayload(), status: "已确认" };
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) {
        showMessage("当前浏览器还没有 Category Lab 本地数据。请先打开一次 Category Lab，再回来导入。", "error");
        return;
      }
      let data;
      try {
        data = JSON.parse(raw);
      } catch (error) {
        showMessage("Category Lab 本地数据无法读取，未导入。", "error");
        return;
      }
      data.devRecords = Array.isArray(data.devRecords) ? data.devRecords : [];
      const record = categoryLabRecord(mergedRow);
      const index = data.devRecords.findIndex(item => item.supplierSubmissionId === id || item.id === record.id);
      if (index >= 0) data.devRecords[index] = { ...data.devRecords[index], ...record };
      else data.devRecords.unshift(record);
      localStorage.setItem(CATEGORYLAB_STORAGE_KEY, JSON.stringify(data));
      const updated = await saveRow(id, { ...mergedRow, status: "已确认" });
      showMessage(`已导入 Category Lab：${updated?.product_name || mergedRow.product_name || ""}`, "success");
    }

    async function deleteRow(id = activeRecordId) {
      if (!roleCanEdit() || !id) return;
      const row = recordById(id);
      const ok = window.confirm(`确认删除这条产品信息？\n${row?.product_name || ""}`);
      if (!ok) return;
      if (cloudbaseReady) {
        await cloudbaseRequest("adminDelete", { id });
      } else {
        const { error } = await client
          .from(TABLE)
          .delete()
          .eq("id", id);
        if (error) throw error;
      }
      records = records.filter(item => item.id !== id);
      renderAll("");
      showMessage("已删除。", "success");
    }

    function csvEscape(value) {
      const text = String(value || "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const headers = [
        "品名",
        "供应商",
        "版本",
        "版本阶段",
        "提交编号",
        "送样时间",
        "产品类型",
        "测试类别",
        "档期名称",
        "本版调整点",
        "产品规格（g）",
        "长度（mm）",
        "宽度（mm）",
        "高度（mm）",
        "产品结构",
        "产品照",
        "测试场景 / 反馈来源",
        "测试反馈",
        "本轮结论",
        "下一步改进方向",
        "报价（元，含税含运）",
        "核心原料及卖点",
        "关键卡点 / 备注",
        "Category Lab 导入",
        "状态"
      ];
      const rows = visibleRecords().map(row => [
        row.product_name,
        row.supplier_name,
        row.version_label,
        deriveVersionStage(row, records),
        row.followup_code,
        row.sample_date,
        row.product_type,
        row.test_category,
        row.campaign,
        row.version_change,
        row.finished_spec,
        row.length_mm,
        row.width_mm,
        row.height_mm,
        row.ingredients_structure,
        imageUrls(row).join(" "),
        row.tasting_scene,
        row.tasting_feedback,
        row.round_conclusion,
        row.next_step_direction,
        row.quote_rmb,
        row.core_ingredients_selling_points,
        row.key_blocker,
        isImportedToCategoryLab(row) ? "已导入 Category Lab" : "未导入 Category Lab",
        row.status
      ]);
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `产品信息收件箱_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function moveSelection(delta) {
      const rows = visibleProductGroupsInDisplayOrder().flatMap(group => group.records);
      if (!rows.length) return;
      const index = Math.max(0, rows.findIndex(row => row.id === activeRecordId));
      const next = rows[Math.min(rows.length - 1, Math.max(0, index + delta))];
      if (next) {
        activeRecordId = next.id;
        renderAll(next.id);
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (cloudbaseReady) {
        cloudbaseAdminCode = loginForm.elements.password.value;
        try {
          const data = await cloudbaseRequest("adminLogin");
          sessionStorage.setItem("categorylabCloudbaseAdminCode", cloudbaseAdminCode);
          profile = data.profile;
          showAppShell();
          await loadRecords();
        } catch (error) {
          cloudbaseAdminCode = "";
          sessionStorage.removeItem("categorylabCloudbaseAdminCode");
          showMessage(error.message || "登录失败。", "error");
        }
        return;
      }
      if (!supabaseReady) {
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const email = loginForm.elements.email.value.trim();
      const password = loginForm.elements.password.value;
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        const text = error.message || "登录失败。";
        showMessage(text.includes("Invalid login credentials") ? "账号或密码不正确。请用 Supabase 里创建的内部账号登录。" : text, "error");
        return;
      }
      await boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error"));
    });

    sessionLogoutBtn.addEventListener("click", logout);
    unlockBtn.addEventListener("click", () => boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error")));
    logoutBtn.addEventListener("click", logout);
    loadBtn.addEventListener("click", loadRecords);
    exportBtn.addEventListener("click", exportCsv);
    searchInput.addEventListener("input", () => renderAll(""));
    sortSelect.addEventListener("change", () => {
      sortMode = sortSelect.value || "submitted";
      renderAll(activeRecordId);
    });
    document.querySelectorAll("[data-status-filter]").forEach(button => {
      button.addEventListener("click", () => {
        statusFilter = button.dataset.statusFilter;
        expandedProductGroupKeys.clear();
        collapsedProductGroupKeys.clear();
        renderAll("");
      });
    });
    listEl.addEventListener("click", event => {
      const groupToggle = event.target.closest("[data-product-group-toggle]");
      if (groupToggle) {
        const key = groupToggle.dataset.productGroupToggle;
        const group = visibleProductGroupsInDisplayOrder().find(item => item.key === key);
        const isActiveGroup = group?.records.some(row => row.id === activeRecordId);
        if (group && !isActiveGroup) {
          const latestVersion = group.records[group.records.length - 1] || group.latest;
          activeRecordId = latestVersion?.id || "";
          supplierEditOpen = false;
          setProductGroupExpanded(key, true);
          renderAll(activeRecordId);
          return;
        }
        const shouldExpand = groupToggle.getAttribute("aria-expanded") !== "true";
        setProductGroupExpanded(key, shouldExpand);
        renderList();
        return;
      }
      const item = event.target.closest("[data-record-id]");
      if (!item) return;
      activeRecordId = item.dataset.recordId;
      supplierEditOpen = false;
      renderAll(activeRecordId);
    });
    appPanel.addEventListener("click", async event => {
      try {
        const versionButton = event.target.closest("[data-version-record-id]");
        if (versionButton) {
          activeRecordId = versionButton.dataset.versionRecordId;
          supplierEditOpen = false;
          renderAll(activeRecordId);
          return;
        }
        const imageButton = event.target.closest("[data-image-url]");
        if (imageButton) {
          lightboxImage.src = imageButton.dataset.imageUrl;
          lightbox.classList.remove("hidden");
          return;
        }
        if (event.target.closest("[data-toggle-supplier-edit]")) {
          supplierEditOpen = !supplierEditOpen;
          renderDetail();
          return;
        }
        if (event.target.closest("[data-save-active]")) {
          await saveRow();
          showMessage("已保存。", "success");
        }
        if (event.target.closest("[data-confirm-active]")) {
          await confirmActiveRow();
          showMessage("已确认。", "success");
        }
        if (event.target.closest("[data-import-active]")) await importToCategoryLab();
        if (event.target.closest("[data-open-product-grouping]")) openProductGroupingModal();
        if (event.target.closest("[data-delete-active]")) await deleteRow();
      } catch (error) {
        showMessage(error.message || "操作失败。", "error");
      }
    });
    appPanel.addEventListener("change", event => {
      if (["tasting_scene", "round_conclusion"].includes(event.target?.dataset?.field)) updateVersionStagePreview();
    });
    productGroupSearch.addEventListener("input", renderProductGroupingCandidates);
    productGroupModal.addEventListener("click", async event => {
      try {
        if (event.target === productGroupModal || event.target.closest("[data-close-product-grouping]")) {
          closeProductGroupingModal();
          return;
        }
        const mergeButton = event.target.closest("[data-merge-product-group-key]");
        if (mergeButton) {
          await mergeProductGroups(mergeButton.dataset.mergeProductGroupKey);
          return;
        }
        if (event.target.closest("[data-detach-current-version]")) {
          await detachCurrentVersion();
          return;
        }
        if (event.target.closest("[data-restore-auto-grouping]")) await restoreAutomaticGrouping();
      } catch (error) {
        showMessage(error.message || "产品归组失败。", "error");
      }
    });
    lightboxClose.addEventListener("click", () => lightbox.classList.add("hidden"));
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) lightbox.classList.add("hidden");
    });
    document.addEventListener("keydown", async event => {
      const tag = event.target?.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        moveSelection(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveSelection(-1);
      } else if (event.key === "Enter" && activeRecordId && roleCanEdit()) {
        event.preventDefault();
        try {
          await confirmActiveRow();
          showMessage("已确认。", "success");
        } catch (error) {
          showMessage(error.message || "操作失败。", "error");
        }
      }
    });

    boot().catch(error => showMessage(error.message || "加载失败。", "error"));
  </script>
</body>
</html>
