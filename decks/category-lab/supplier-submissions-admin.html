<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>供应商提交收件箱</title>
  <style>
    :root {
      --paper: #f7f3ea;
      --panel: #fffdf8;
      --line: #d7c7ad;
      --ink: #1d1a16;
      --muted: #756b5d;
      --accent: #1f6f5b;
      --danger: #b23b28;
      --shadow: 0 16px 42px rgba(34, 28, 18, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }
    main {
      width: min(1460px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 30px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(34, 28, 18, 0.08);
    }
    .auth-panel {
      max-width: 620px;
      padding: 0;
      margin: 0 auto;
    }
    .auth-card {
      padding: 22px;
    }
    .auth-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
    }
    .auth-copy {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 138px auto auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eadfce;
      background: #fbf7ee;
    }
    .profile-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #eadfce;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 7px 9px;
      outline: none;
    }
    input, select { min-height: 36px; }
    textarea {
      min-height: 64px;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b18a47;
      box-shadow: 0 0 0 3px rgba(177, 138, 71, 0.16);
    }
    label {
      display: block;
      margin: 0 0 6px;
      color: #3e352b;
      font-size: 12px;
      font-weight: 900;
    }
    button, .link-button {
      appearance: none;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      padding: 7px 11px;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button.danger { color: var(--danger); }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 4px 8px;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 230px);
    }
    table {
      width: 100%;
      min-width: 1340px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid #eadfce;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #efe4d1;
      color: #3e352b;
      font-size: 11px;
    }
    tbody tr:nth-child(even) td { background: rgba(255, 250, 241, 0.52); }
    td strong {
      display: block;
      margin-bottom: 3px;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 76px;
      max-width: 116px;
    }
    .thumbs img {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f1eadf;
      object-fit: cover;
    }
    .stack {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .stack.compact { min-width: 0; }
    .field-block {
      display: grid;
      gap: 4px;
    }
    .field-block span {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 900;
    }
    .import-state {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .import-state.ok { color: var(--accent); }
    .import-state.warn { color: var(--danger); }
    .actions {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .message {
      display: none;
      margin: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      background: #fff;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.error {
      border-color: rgba(178, 59, 40, 0.42);
      background: #fff8f6;
      color: var(--danger);
    }
    .message.success {
      border-color: rgba(31, 111, 91, 0.42);
      background: #f6fffb;
      color: var(--accent);
    }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      main {
        width: min(100vw - 22px, 1380px);
        padding-top: 18px;
      }
      header { display: block; }
      .header-actions { justify-content: stretch; margin-top: 12px; }
      .toolbar { grid-template-columns: 1fr; }
      button, .link-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Category Lab Internal Inbox</p>
        <h1>供应商提交收件箱</h1>
      </div>
      <div class="header-actions">
        <button id="headerLoginBtn" type="button">登录</button>
        <button class="danger hidden" id="headerLogoutBtn" type="button">退出登录</button>
        <a class="link-button" href="/decks/category-lab/categorylab">打开 Category Lab</a>
      </div>
    </header>

    <section class="panel auth-panel" id="loginPanel">
      <div class="auth-card hidden" id="sessionGate">
        <p class="auth-title">收件箱已锁定</p>
        <p class="auth-copy" id="sessionGateText">当前浏览器已有登录态。进入前请确认周围环境。</p>
        <div class="actions">
          <button class="primary" id="unlockBtn" type="button">进入收件箱</button>
          <button class="danger" id="sessionLogoutBtn" type="button">退出登录</button>
        </div>
      </div>
      <form class="auth-card" id="loginForm">
        <p class="auth-title">登录收件箱</p>
        <p class="auth-copy">内部资料只在登录后显示。离开电脑前请退出登录。</p>
        <label for="email">账号</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password" style="margin-top:12px;">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions" style="margin-top:16px;">
          <button class="primary" type="submit">登录</button>
        </div>
      </form>
    </section>

    <div class="message" id="message"></div>

    <section class="panel hidden" id="appPanel">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="搜索品名、供应商、备注">
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="待处理">待处理</option>
          <option value="已确认">已确认</option>
        </select>
        <button class="primary" id="loadBtn" type="button">刷新</button>
        <button id="exportBtn" type="button">导出 CSV</button>
        <button class="danger" id="logoutBtn" type="button">退出</button>
      </div>
      <div class="profile-bar" id="profileBar">
        <span class="pill">未登录</span>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width: 86px;">
            <col style="width: 236px;">
            <col style="width: 300px;">
            <col style="width: 246px;">
            <col style="width: 174px;">
            <col style="width: 164px;">
            <col style="width: 132px;">
            <col style="width: 92px;">
          </colgroup>
          <thead>
            <tr>
              <th>产品照</th>
              <th>供应商提交 / 调整点</th>
              <th>规格 / 结构 / 卖点</th>
              <th>现场反馈</th>
              <th>下一步</th>
              <th>关键卡点</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="8" class="muted">暂无数据。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./cloudbase-config.js"></script>
  <script>
    const TABLE = "supplier_feedback_records";
    const CATEGORYLAB_STORAGE_KEY = "burger-bom-tool-v1";
    const config = window.CATEGORYLAB_SUPABASE || {};
    const cloudbaseConfig = window.CATEGORYLAB_CLOUDBASE || {};
    const cloudbaseHost = /tcloudbase|cloudbase|tencent/i.test(location.hostname) || new URLSearchParams(location.search).get("backend") === "cloudbase";
    const cloudbaseReady = Boolean(cloudbaseConfig.apiUrl) && cloudbaseHost;
    const supabaseReady = Boolean(config.url && config.anonKey && window.supabase);
    const client = supabaseReady ? window.supabase.createClient(config.url, config.anonKey) : null;
    const loginPanel = document.querySelector("#loginPanel");
    const appPanel = document.querySelector("#appPanel");
    const loginForm = document.querySelector("#loginForm");
    const sessionGate = document.querySelector("#sessionGate");
    const sessionGateText = document.querySelector("#sessionGateText");
    const unlockBtn = document.querySelector("#unlockBtn");
    const sessionLogoutBtn = document.querySelector("#sessionLogoutBtn");
    const headerLoginBtn = document.querySelector("#headerLoginBtn");
    const headerLogoutBtn = document.querySelector("#headerLogoutBtn");
    const searchInput = document.querySelector("#searchInput");
    const statusFilter = document.querySelector("#statusFilter");
    const loadBtn = document.querySelector("#loadBtn");
    const exportBtn = document.querySelector("#exportBtn");
    const logoutBtn = document.querySelector("#logoutBtn");
    const rowsEl = document.querySelector("#rows");
    const message = document.querySelector("#message");
    const profileBar = document.querySelector("#profileBar");
    let records = [];
    let profile = null;
    let cloudbaseAdminCode = sessionStorage.getItem("categorylabCloudbaseAdminCode") || "";

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
    }

    async function cloudbaseRequest(action, payload = {}) {
      const response = await fetch(cloudbaseConfig.apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CategoryLab-Admin-Code": cloudbaseAdminCode
        },
        body: JSON.stringify({ action, adminCode: cloudbaseAdminCode, ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || `请求失败（${response.status}）`);
      }
      return result.data;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function nl(value) {
      return escapeHtml(value).replace(/\n/g, "<br>");
    }

    function dateText(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function roleCanEdit() {
      return ["owner", "pm"].includes(profile?.role);
    }

    function resetInMemoryState() {
      profile = null;
      records = [];
      rowsEl.innerHTML = `<tr><td colspan="8" class="muted">暂无数据。</td></tr>`;
      profileBar.innerHTML = `<span class="pill">未登录</span>`;
    }

    function setHeaderAuthState({ hasSession = false, unlocked = false } = {}) {
      headerLoginBtn.classList.toggle("hidden", unlocked);
      headerLoginBtn.textContent = hasSession ? "进入收件箱" : "登录";
      headerLogoutBtn.classList.toggle("hidden", !hasSession);
    }

    function showLoginForm() {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.remove("hidden");
      sessionGate.classList.add("hidden");
      appPanel.classList.add("hidden");
      setHeaderAuthState({ hasSession: false, unlocked: false });
    }

    function showSessionGate(session) {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.add("hidden");
      sessionGate.classList.remove("hidden");
      appPanel.classList.add("hidden");
      sessionGateText.textContent = `当前登录账号：${session?.user?.email || "内部账号"}。进入前请确认周围环境。`;
      setHeaderAuthState({ hasSession: true, unlocked: false });
    }

    function showAppShell() {
      loginPanel.classList.add("hidden");
      appPanel.classList.remove("hidden");
      setHeaderAuthState({ hasSession: true, unlocked: true });
    }

    async function logout() {
      if (cloudbaseReady) {
        sessionStorage.removeItem("categorylabCloudbaseAdminCode");
        cloudbaseAdminCode = "";
      } else if (client) await client.auth.signOut();
      clearMessage();
      showLoginForm();
      loginForm.elements.password.value = "";
      loginForm.elements.email.focus();
    }

    function imageUrls(row) {
      return Array.isArray(row.image_paths)
        ? row.image_paths.map(image => image.publicUrl || image.url).filter(Boolean)
        : [];
    }

    function optionHtml(options, selected) {
      return options.map(option => `<option value="${escapeHtml(option)}" ${option === selected ? "selected" : ""}>${escapeHtml(option || "请选择")}</option>`).join("");
    }

    function inputHtml(field, value, placeholder = "", disabled = "", type = "text") {
      return `<input data-field="${escapeHtml(field)}" type="${escapeHtml(type)}" value="${escapeHtml(value || "")}" ${disabled} placeholder="${escapeHtml(placeholder)}">`;
    }

    function textareaHtml(field, value, placeholder = "", disabled = "") {
      return `<textarea data-field="${escapeHtml(field)}" ${disabled} placeholder="${escapeHtml(placeholder)}">${escapeHtml(value || "")}</textarea>`;
    }

    function fieldBlock(label, html) {
      return `<label class="field-block"><span>${escapeHtml(label)}</span>${html}</label>`;
    }

    function categoryLabData() {
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function isImportedToCategoryLab(row) {
      const data = categoryLabData();
      const devRecords = Array.isArray(data?.devRecords) ? data.devRecords : [];
      return devRecords.some(item => item.supplierSubmissionId === row.id || item.id === `supplier-${row.id}`);
    }

    function visibleRecords() {
      const status = statusFilter.value;
      const q = searchInput.value.trim().toLowerCase();
      return records.filter(row => {
        const statusOk = !status || row.status === status;
        const haystack = [
          row.product_name,
          row.supplier_name,
          row.version_label,
          row.product_type,
          row.test_category,
          row.version_change,
          row.finished_spec,
          row.ingredients_structure,
          row.core_ingredients_selling_points,
          row.tasting_feedback,
          row.next_step_direction,
          row.key_blocker
        ].join(" ").toLowerCase();
        return statusOk && (!q || haystack.includes(q));
      });
    }

    function renderProfile() {
      const total = records.length;
      const pending = records.filter(row => row.status === "待处理").length;
      const confirmed = records.filter(row => row.status === "已确认").length;
      const missingImport = records.filter(row => row.status === "已确认" && !isImportedToCategoryLab(row)).length;
      profileBar.innerHTML = `
        <span class="pill">${escapeHtml(profile?.display_name || profile?.email || "")}</span>
        <span class="pill">权限：${escapeHtml(profile?.role || "viewer")}</span>
        <span class="pill">总计 ${total}</span>
        <span class="pill">待处理 ${pending}</span>
        <span class="pill">已确认 ${confirmed}</span>
        <span class="pill">已确认未导入 ${missingImport}</span>
      `;
    }

    function renderRows() {
      const rows = visibleRecords();
      renderProfile();
      const disabled = roleCanEdit() ? "" : "disabled";
      rowsEl.innerHTML = rows.map(row => {
        const imgs = imageUrls(row);
        const imported = isImportedToCategoryLab(row);
        const importText = imported ? "已导入 Category Lab" : "未导入 Category Lab";
        const importClass = imported ? "import-state ok" : row.status === "已确认" ? "import-state warn" : "import-state";
        return `
          <tr data-row="${escapeHtml(row.id)}">
            <td>
              <div class="thumbs">
                ${imgs.map((url, index) => `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer"><img src="${escapeHtml(url)}" alt="产品照 ${index + 1}"></a>`).join("") || "-"}
              </div>
            </td>
            <td>
              <div class="stack">
                ${fieldBlock("品名", inputHtml("product_name", row.product_name, "品名", disabled))}
                ${fieldBlock("供应商", inputHtml("supplier_name", row.supplier_name, "供应商", disabled))}
                ${fieldBlock("版本", inputHtml("version_label", row.version_label, "版本", disabled))}
                ${fieldBlock("送样时间", inputHtml("sample_date", row.sample_date, "", disabled, "date"))}
                ${fieldBlock("产品类型", inputHtml("product_type", row.product_type, "产品类型", disabled))}
                ${fieldBlock("测试类别", inputHtml("test_category", row.test_category, "测试类别", disabled))}
                ${fieldBlock("本版调整点", textareaHtml("version_change", row.version_change, "本版调整点", disabled))}
              </div>
              <div class="muted">提交编号：${escapeHtml(row.followup_code || "-")}</div>
              <div class="muted">送样：${escapeHtml(row.sample_date || "")}</div>
              <div class="muted">提交：${escapeHtml(dateText(row.created_at))}</div>
            </td>
            <td>
              <div class="stack">
                ${fieldBlock("成品规格（克）", inputHtml("finished_spec", row.finished_spec, "成品规格（克）", disabled))}
                ${fieldBlock("报价（元，含税含运）", inputHtml("quote_rmb", row.quote_rmb, "报价（元，含税含运）", disabled))}
                ${fieldBlock("产品结构", textareaHtml("ingredients_structure", row.ingredients_structure, "产品结构", disabled))}
                ${fieldBlock("核心原料及卖点", textareaHtml("core_ingredients_selling_points", row.core_ingredients_selling_points, "核心原料及卖点", disabled))}
              </div>
            </td>
            <td>
              <div class="stack">
                ${fieldBlock("测试场景 / 反馈来源", `<select data-field="tasting_scene" ${disabled}>
                  ${optionHtml(["", "前期打磨测试", "众测后优化", "中试后优化", "上市后优化"], row.tasting_scene || "")}
                </select>`)}
                ${fieldBlock("测试反馈", `<textarea data-field="tasting_feedback" ${disabled} placeholder="测试反馈">${escapeHtml(row.tasting_feedback || "")}</textarea>`)}
                ${fieldBlock("本轮结论", `<select data-field="round_conclusion" ${disabled}>
                  ${optionHtml(["", "继续调整", "暂停", "通过且储备", "通过且进入众测"], row.round_conclusion || "")}
                </select>`)}
              </div>
            </td>
            <td>${fieldBlock("下一步改进方向", `<textarea data-field="next_step_direction" ${disabled} placeholder="下一步改进方向">${escapeHtml(row.next_step_direction || "")}</textarea>`)}</td>
            <td>${fieldBlock("关键卡点 / 备注", `<textarea data-field="key_blocker" ${disabled} placeholder="关键卡点 / 备注">${escapeHtml(row.key_blocker || "")}</textarea>`)}</td>
            <td>
              <div class="stack compact">
                ${fieldBlock("处理状态", `<select data-field="status" ${disabled}>
                  ${optionHtml(["待处理", "已确认"], row.status || "待处理")}
                </select>`)}
                <div class="${importClass}">${importText}</div>
              </div>
            </td>
            <td>
              <div class="actions">
                <button data-save="${escapeHtml(row.id)}" ${disabled} type="button">保存</button>
                <button data-import="${escapeHtml(row.id)}" ${disabled} type="button">${imported ? "更新导入" : "导入"}</button>
                <button class="danger" data-delete="${escapeHtml(row.id)}" ${disabled} type="button">删除</button>
              </div>
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="8" class="muted">暂无数据。</td></tr>`;
    }

    async function loadProfile(session) {
      if (cloudbaseReady) return;
      const { data, error } = await client
        .from("categorylab_profiles")
        .select("*")
        .eq("id", session.user.id)
        .single();
      if (error) throw error;
      profile = data;
    }

    async function loadRecords() {
      if (!profile) return;
      loadBtn.disabled = true;
      loadBtn.textContent = "读取中...";
      clearMessage();
      try {
        if (cloudbaseReady) {
          const data = await cloudbaseRequest("adminList");
          records = data.records || [];
        } else {
          const { data, error } = await client
            .from(TABLE)
            .select("*")
            .order("created_at", { ascending: false });
          if (error) throw error;
          records = data || [];
        }
        renderRows();
        const missingImport = records.filter(row => row.status === "已确认" && !isImportedToCategoryLab(row)).length;
        if (missingImport > 0) {
          showMessage(`有 ${missingImport} 条已确认记录还没有导入 Category Lab。`, "");
        }
      } catch (error) {
        showMessage(error.message || "读取失败。", "error");
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = "刷新";
      }
    }

    async function boot({ unlock = false } = {}) {
      if (cloudbaseReady) {
        loginForm.elements.email.required = false;
        loginForm.elements.email.value = loginForm.elements.email.value || "Louise";
        document.querySelector('label[for="email"]').textContent = "账号";
        document.querySelector('label[for="password"]').textContent = "内部访问码";
        loginForm.elements.email.placeholder = "Louise";
        loginForm.elements.password.placeholder = "请输入内部访问码";
        if (!cloudbaseAdminCode) {
          showLoginForm();
          return;
        }
        const data = await cloudbaseRequest("adminLogin");
        profile = data.profile;
        showAppShell();
        await loadRecords();
        return;
      }
      if (!supabaseReady) {
        showLoginForm();
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const { data } = await client.auth.getSession();
      if (!data.session) {
        showLoginForm();
        return;
      }
      if (!unlock) {
        showSessionGate(data.session);
        return;
      }
      await loadProfile(data.session);
      showAppShell();
      await loadRecords();
    }

    function rowElement(id) {
      return rowsEl.querySelector(`[data-row="${CSS.escape(id)}"]`);
    }

    function rowPayload(id) {
      const tr = rowElement(id);
      if (!tr) return {};
      const value = field => tr.querySelector(`[data-field="${field}"]`)?.value || "";
      const quoteText = value("quote_rmb").trim();
      const quoteCleaned = quoteText.replace(/[^0-9.]/g, "");
      const quote = Number(quoteCleaned);
      return {
        product_name: value("product_name").trim(),
        supplier_name: value("supplier_name").trim(),
        version_label: value("version_label").trim(),
        sample_date: value("sample_date") || null,
        product_type: value("product_type").trim(),
        test_category: value("test_category").trim(),
        version_change: value("version_change").trim(),
        finished_spec: value("finished_spec").trim(),
        ingredients_structure: value("ingredients_structure").trim(),
        quote_rmb: quoteCleaned && Number.isFinite(quote) ? quote : null,
        core_ingredients_selling_points: value("core_ingredients_selling_points").trim(),
        tasting_scene: value("tasting_scene"),
        tasting_feedback: value("tasting_feedback").trim(),
        round_conclusion: value("round_conclusion"),
        next_step_direction: value("next_step_direction").trim(),
        key_blocker: value("key_blocker").trim(),
        status: value("status")
      };
    }

    async function saveRow(id) {
      if (!roleCanEdit()) return;
      let data;
      if (cloudbaseReady) {
        const response = await cloudbaseRequest("adminUpdate", { id, payload: rowPayload(id) });
        data = response.record;
      } else {
        const response = await client
          .from(TABLE)
          .update(rowPayload(id))
          .eq("id", id)
          .select("*")
          .single();
        if (response.error) throw response.error;
        data = response.data;
      }
      const index = records.findIndex(row => row.id === id);
      if (index >= 0) records[index] = data;
      renderRows();
      if (data.status === "已确认" && !isImportedToCategoryLab(data)) {
        showMessage("已保存。这条记录已确认，但还没有导入 Category Lab。", "");
      } else {
        showMessage("已保存。", "success");
      }
    }

    function categoryLabRecord(row) {
      const tastingSummary = [
        row.round_conclusion ? `本轮结论：${row.round_conclusion}` : "",
        row.tasting_feedback ? `测试反馈：${row.tasting_feedback}` : ""
      ].filter(Boolean).join("\n");
      return {
        id: `supplier-${row.id}`,
        time: row.created_at ? dateText(row.created_at) : new Date().toLocaleString("zh-CN"),
        category: row.product_type || "",
        campaign: row.test_category || row.tasting_scene || "",
        project: row.product_name || "",
        supplier: row.supplier_name || "",
        brand: "",
        spec: row.finished_spec || "",
        price: row.quote_rmb || "",
        weight: "",
        length: "",
        width: "",
        height: "",
        version: row.version_label || "V1",
        testDate: row.sample_date || "",
        type: "OEM 品类测试",
        images: imageUrls(row),
        image: imageUrls(row)[0] || "",
        overallEvaluation: tastingSummary,
        sensory: {
          appearance: "",
          appearanceScore: "",
          aroma: "",
          aromaScore: "",
          flavor: row.tasting_feedback || "",
          flavorScore: "",
          texture: "",
          textureScore: ""
        },
        materials: row.ingredients_structure || "",
        yield: {},
        note: row.next_step_direction || "",
        supplierSubmissionId: row.id,
        supplierSubmissionSummary: [
          row.followup_code ? `提交编号：${row.followup_code}` : "",
          row.product_type ? `产品类型：${row.product_type}` : "",
          row.test_category ? `测试类别：${row.test_category}` : "",
          row.version_change ? `本版调整点：${row.version_change}` : "",
          row.core_ingredients_selling_points ? `核心原料及卖点：${row.core_ingredients_selling_points}` : "",
          row.key_blocker ? `关键卡点 / 备注：${row.key_blocker}` : ""
        ].filter(Boolean).join("\n")
      };
    }

    async function importToCategoryLab(id) {
      if (!roleCanEdit()) return;
      const row = records.find(item => item.id === id);
      if (!row) return;
      const payload = { ...rowPayload(id), status: "已确认" };
      const mergedRow = { ...row, ...payload };
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) {
        showMessage("当前浏览器还没有 Category Lab 本地数据。请先打开一次 Category Lab，再回来导入。", "error");
        return;
      }
      let data;
      try {
        data = JSON.parse(raw);
      } catch (error) {
        showMessage("Category Lab 本地数据无法读取，未导入。", "error");
        return;
      }
      data.devRecords = Array.isArray(data.devRecords) ? data.devRecords : [];
      const record = categoryLabRecord(mergedRow);
      const index = data.devRecords.findIndex(item => item.supplierSubmissionId === id || item.id === record.id);
      if (index >= 0) data.devRecords[index] = { ...data.devRecords[index], ...record };
      else data.devRecords.unshift(record);
      localStorage.setItem(CATEGORYLAB_STORAGE_KEY, JSON.stringify(data));

      let updated;
      if (cloudbaseReady) {
        const response = await cloudbaseRequest("adminUpdate", { id, payload });
        updated = response.record;
      } else {
        const response = await client
          .from(TABLE)
          .update(payload)
          .eq("id", id)
          .select("*")
          .single();
        if (response.error) throw response.error;
        updated = response.data;
      }
      const recordIndex = records.findIndex(item => item.id === id);
      if (recordIndex >= 0) records[recordIndex] = updated;
      renderRows();
      showMessage(`已导入 Category Lab：${mergedRow.product_name || ""}`, "success");
    }

    async function deleteRow(id) {
      if (!roleCanEdit()) return;
      const row = records.find(item => item.id === id);
      const ok = window.confirm(`确认删除这条供应商提交？\n${row?.product_name || ""}`);
      if (!ok) return;
      if (cloudbaseReady) await cloudbaseRequest("adminDelete", { id });
      else {
        const { error } = await client
          .from(TABLE)
          .delete()
          .eq("id", id);
        if (error) throw error;
      }
      records = records.filter(item => item.id !== id);
      renderRows();
      showMessage("已删除。", "success");
    }

    function csvEscape(value) {
      const text = String(value || "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const headers = [
        "品名",
        "供应商",
        "版本",
        "提交编号",
        "送样时间",
        "产品类型",
        "测试类别",
        "本版调整点",
        "成品规格（克）",
        "产品结构",
        "产品照",
        "测试场景 / 反馈来源",
        "测试反馈",
        "本轮结论",
        "下一步改进方向",
        "报价（元，含税含运）",
        "核心原料及卖点",
        "关键卡点 / 备注",
        "Category Lab 导入",
        "状态"
      ];
      const rows = visibleRecords().map(row => [
        row.product_name,
        row.supplier_name,
        row.version_label,
        row.followup_code,
        row.sample_date,
        row.product_type,
        row.test_category,
        row.version_change,
        row.finished_spec,
        row.ingredients_structure,
        imageUrls(row).join(" "),
        row.tasting_scene,
        row.tasting_feedback,
        row.round_conclusion,
        row.next_step_direction,
        row.quote_rmb,
        row.core_ingredients_selling_points,
        row.key_blocker,
        isImportedToCategoryLab(row) ? "已导入 Category Lab" : "未导入 Category Lab",
        row.status
      ]);
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `供应商提交_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (cloudbaseReady) {
        cloudbaseAdminCode = loginForm.elements.password.value;
        try {
          const data = await cloudbaseRequest("adminLogin");
          sessionStorage.setItem("categorylabCloudbaseAdminCode", cloudbaseAdminCode);
          profile = data.profile;
          showAppShell();
          await loadRecords();
        } catch (error) {
          cloudbaseAdminCode = "";
          sessionStorage.removeItem("categorylabCloudbaseAdminCode");
          showMessage(error.message || "登录失败。", "error");
        }
        return;
      }
      if (!supabaseReady) {
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const email = loginForm.elements.email.value.trim();
      const password = loginForm.elements.password.value;
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        const text = error.message || "登录失败。";
        showMessage(text.includes("Invalid login credentials") ? "账号或密码不正确。请用 Supabase 里创建的内部账号登录。" : text, "error");
        return;
      }
      await boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error"));
    });

    logoutBtn.addEventListener("click", logout);
    headerLogoutBtn.addEventListener("click", logout);
    sessionLogoutBtn.addEventListener("click", logout);
    unlockBtn.addEventListener("click", () => boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error")));
    headerLoginBtn.addEventListener("click", async () => {
      if (cloudbaseReady) {
        if (cloudbaseAdminCode) {
          await boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error"));
          return;
        }
        showLoginForm();
        loginForm.elements.password.focus();
        return;
      }
      const { data } = supabaseReady ? await client.auth.getSession() : { data: { session: null } };
      if (data.session) {
        await boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error"));
        return;
      }
      showLoginForm();
      loginForm.elements.email.focus();
    });

    loadBtn.addEventListener("click", loadRecords);
    exportBtn.addEventListener("click", exportCsv);
    statusFilter.addEventListener("change", renderRows);
    searchInput.addEventListener("input", renderRows);
    rowsEl.addEventListener("click", async event => {
      const saveBtn = event.target.closest("[data-save]");
      const importBtn = event.target.closest("[data-import]");
      const deleteBtn = event.target.closest("[data-delete]");
      try {
        if (saveBtn) await saveRow(saveBtn.dataset.save);
        if (importBtn) await importToCategoryLab(importBtn.dataset.import);
        if (deleteBtn) await deleteRow(deleteBtn.dataset.delete);
      } catch (error) {
        showMessage(error.message || "操作失败。", "error");
      }
    });

    boot().catch(error => showMessage(error.message || "加载失败。", "error"));
  </script>
</body>
</html>
