<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品信息收件箱</title>
  <style>
    :root {
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --side: #f3efe6;
      --ink: #2b2620;
      --body: #4a4438;
      --muted: #6b6254;
      --faint: #9a9081;
      --line: #e6e0d4;
      --line-soft: #eee8dc;
      --button-line: #d4cbb9;
      --pending: #a4550f;
      --pending-bg: #f3e3cd;
      --confirmed: #3d7a4a;
      --danger: #c9503f;
      --danger-dark: #a63a2b;
      --danger-copy: #7a4238;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif;
      --serif: var(--sans);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }
    button, input, select, textarea, a {
      font: inherit;
    }
    button, .button-link {
      appearance: none;
      min-height: 38px;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      padding: 8px 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary, .button-link.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button.danger {
      color: var(--danger);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
    }
    input, select { min-height: 36px; }
    textarea {
      min-height: 86px;
      resize: vertical;
      line-height: 1.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b89254;
      box-shadow: 0 0 0 3px rgba(184, 146, 84, .14);
    }
    .hidden { display: none !important; }

    .auth-page {
      min-height: 100%;
      padding: 28px;
    }
    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto 18px;
    }
    .auth-header h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      line-height: 1.2;
    }
    .auth-header p,
    .auth-copy {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .auth-card {
      width: min(620px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 26px;
    }
    .auth-title {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
    }
    .auth-card label {
      display: block;
      margin: 16px 0 6px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .auth-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .inbox-app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--paper);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 66px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 14px 20px 12px;
    }
    .top-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }
    .top-title h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .top-title span {
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .top-actions input {
      width: 220px;
      min-height: 34px;
      background: transparent;
    }
    .top-actions button,
    .top-actions .button-link {
      min-height: 34px;
      padding: 6px 10px;
      background: transparent;
      font-size: 12px;
    }
    .filterbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 46px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 0 20px;
    }
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .filter-tab {
      min-height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .filter-tab.active {
      color: var(--ink);
    }
    .filter-tab span {
      color: var(--faint);
      font-weight: 600;
    }
    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .sort-control select {
      width: auto;
      min-height: 32px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 28px 4px 9px;
    }
    .message {
      display: none;
      border-bottom: 1px solid var(--line);
      background: #fffaf1;
      color: var(--muted);
      padding: 10px 20px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .message.show { display: block; }
    .message.error {
      background: #fff4f1;
      color: var(--danger-dark);
    }
    .message.success {
      background: #f5fbf3;
      color: var(--confirmed);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 400px minmax(0, 1fr) 260px;
      overflow: hidden;
    }
    .list-pane,
    .reading-pane,
    .meta-sidebar {
      min-height: 0;
      overflow-y: auto;
    }
    .list-pane {
      border-right: 1px solid var(--line);
      background: var(--paper);
    }
    .submission-list {
      display: grid;
    }
    .test-category-section {
      background: var(--paper);
    }
    .test-category-section + .test-category-section {
      border-top: 1px solid var(--line);
    }
    .test-category-bar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px 9px 14px;
      border-top: 1px solid;
      border-bottom: 1px solid;
      border-left: 3px solid;
    }
    .test-category-bar.campaign-section {
      border-color: #b58a4a;
      background: #efe4cf;
      color: #4b3822;
    }
    .test-category-bar.proposal-section {
      border-color: #668069;
      background: #e4ebe4;
      color: #2f4a35;
    }
    .test-category-bar.uncategorized-section {
      border-color: #8e877a;
      background: #eeeae3;
      color: #514c44;
    }
    .test-category-title {
      font-size: 13px;
      font-weight: 800;
    }
    .test-category-meta {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: currentColor;
      font-size: 11px;
      font-weight: 650;
      opacity: .78;
      text-align: right;
    }
    .test-category-note {
      border-right: 1px solid currentColor;
      padding-right: 8px;
    }
    .product-group {
      border-bottom: 1px solid var(--line);
    }
    .product-group.active {
      background: rgba(255, 253, 248, .54);
    }
    .product-group-head {
      display: block;
      width: 100%;
      min-height: 82px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      padding: 13px 15px 12px;
      text-align: left;
      white-space: normal;
    }
    .product-group.active .product-group-head {
      border-left-color: var(--ink);
      background: var(--panel);
    }
    .product-group-title-row,
    .product-group-meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .product-group-title {
      min-width: 0;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }
    .product-group-caret {
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 12px;
      transition: transform .16s ease;
    }
    .product-group.collapsed .product-group-caret {
      transform: rotate(-90deg);
    }
    .product-group-meta-row {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
    }
    .product-group-status {
      flex: 0 0 auto;
      color: var(--faint);
      font-weight: 500;
    }
    .product-version-list {
      padding: 0 0 8px 18px;
    }
    .product-group.collapsed .product-version-list {
      display: none;
    }
    .version-item {
      display: block;
      width: 100%;
      min-height: 78px;
      border: 0;
      border-left: 2px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 10px 14px 10px 13px;
      text-align: left;
      white-space: normal;
    }
    .version-item + .version-item {
      border-top: 1px solid var(--line-soft);
    }
    .version-item.active {
      border-left-color: var(--ink);
      background: var(--panel);
    }
    .version-item.filter-muted {
      opacity: .46;
    }
    .version-item-head,
    .version-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .version-item-version {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
    }
    .version-item-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .version-item-summary {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    .item-time {
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 11px;
      font-weight: 500;
    }
    .status-word.pending { color: var(--pending); }
    .status-word.confirmed { color: var(--confirmed); }
    .empty-list,
    .empty-detail {
      padding: 24px;
      color: var(--faint);
      font-size: 13px;
    }
    .reading-pane {
      background: var(--paper);
      padding: 28px 36px 42px;
    }
    .reading-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .detail-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .detail-title-row h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-badge.pending {
      background: var(--pending-bg);
      color: var(--pending);
    }
    .status-badge.confirmed {
      background: #dfeadf;
      color: var(--confirmed);
    }
    .version-stage-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      border: 1px solid #ccb98f;
      border-radius: 999px;
      background: #f2ead8;
      color: #6e5426;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
    }
    .version-stage-preview {
      min-height: 34px;
      border-left: 2px solid #b89254;
      background: #f8f2e6;
      color: var(--muted);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .detail-meta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .version-switcher {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0 18px;
      overflow-x: auto;
      padding: 2px 0 4px;
    }
    .version-switch-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 9px;
      border-color: var(--button-line);
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
    }
    .version-switch-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    .version-switch-button.active .version-stage-badge {
      border-color: rgba(255, 255, 255, .48);
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }
    .image-strip {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin: 12px 0 24px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .image-button {
      appearance: none;
      display: block;
      min-height: 0;
      border: 0;
      border-radius: 6px;
      background: #eee7da;
      padding: 0;
      overflow: hidden;
      cursor: zoom-in;
    }
    .image-button.main img {
      width: 190px;
      height: 132px;
    }
    .image-button img {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: cover;
    }
    .section-block {
      margin: 0 0 22px;
    }
    .supplier-block {
      margin: 0 0 26px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }
    .supplier-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }
    .supplier-head h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .supplier-edit-toggle {
      min-height: 30px;
      padding: 5px 9px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .supplier-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 16px;
      margin: 0 0 20px;
    }
    .fact-item {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .fact-item span {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
    }
    .fact-item b {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .supplier-edit-panel {
      margin-top: 18px;
      border-top: 1px solid var(--line-soft);
      padding-top: 18px;
    }
    .section-block h3,
    .edit-panel h3 {
      margin: 0 0 9px;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .section-copy {
      margin: 0;
      color: var(--body);
      font-size: 14px;
      line-height: 1.85;
      overflow-wrap: anywhere;
    }
    .section-block.critical {
      border-top: 2px solid var(--danger);
      padding-top: 10px;
    }
    .section-block.critical h3 {
      color: var(--danger-dark);
    }
    .section-block.critical .section-copy {
      color: var(--danger-copy);
    }
    .edit-panel {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .edit-grid .span-2 { grid-column: 1 / -1; }
    .field-label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .field-label input,
    .field-label select,
    .field-label textarea {
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
    }
    .meta-sidebar {
      border-left: 1px solid var(--line);
      background: var(--side);
      padding: 22px 16px 28px;
    }
    .meta-actions {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }
    .meta-actions button,
    .meta-actions .button-link {
      width: 100%;
      justify-content: center;
      text-align: center;
    }
    .meta-divider {
      border-top: 1px solid var(--line);
      margin: 18px 0;
    }
    .kv-list {
      display: grid;
      gap: 13px;
    }
    .kv-item {
      display: grid;
      gap: 4px;
    }
    .kv-item label,
    .kv-item span {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
    }
    .kv-item b {
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .kv-item input,
    .kv-item select {
      min-height: 34px;
      font-size: 12.5px;
      font-weight: 500;
    }
    .import-state {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }
    .import-state.ok { color: var(--confirmed); }
    .import-state.warn { color: var(--danger); }
    .grouping-modal {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: grid;
      place-items: center;
      background: rgba(43, 38, 32, .56);
      padding: 24px;
    }
    .grouping-dialog {
      width: min(620px, 100%);
      max-height: min(760px, 90vh);
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 22px;
    }
    .grouping-dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }
    .grouping-dialog-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
    }
    .grouping-dialog-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .grouping-dialog-head button {
      min-height: 32px;
      padding: 5px 9px;
    }
    .grouping-search {
      margin: 16px 0;
    }
    .grouping-section {
      margin-top: 18px;
    }
    .grouping-section h3 {
      margin: 0 0 9px;
      font-size: 13px;
    }
    .grouping-target-list {
      display: grid;
      border-top: 1px solid var(--line-soft);
    }
    .grouping-target {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      background: transparent;
      padding: 10px 2px;
      text-align: left;
      white-space: normal;
    }
    .grouping-target:hover {
      background: var(--paper);
    }
    .grouping-target-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .grouping-target-copy b {
      font-size: 13px;
    }
    .grouping-target-copy span,
    .grouping-reason {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    .grouping-reason {
      flex: 0 0 auto;
      color: var(--pending);
    }
    .grouping-empty {
      color: var(--faint);
      font-size: 12px;
      padding: 12px 0;
    }
    .grouping-corrections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 22px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(43, 38, 32, .72);
      padding: 28px;
    }
    .lightbox.hidden { display: none; }
    .lightbox button {
      position: absolute;
      top: 18px;
      right: 18px;
      border-color: rgba(255, 255, 255, .4);
      background: rgba(43, 38, 32, .72);
      color: #fff;
    }
    .lightbox img {
      max-width: min(980px, 92vw);
      max-height: 86vh;
      border-radius: 6px;
      object-fit: contain;
      background: #fff;
    }
    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 360px minmax(0, 1fr);
      }
      .meta-sidebar {
        grid-column: 2;
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }
    @media (max-width: 480px) {
      .test-category-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }
      .test-category-meta {
        justify-content: flex-start;
        text-align: left;
      }
    }
    @media (max-width: 780px) {
      .inbox-app {

    let records = [];
