<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品信息收件箱</title>
  <style>
    :root {
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --side: #f3efe6;
      --ink: #2b2620;
      --body: #4a4438;
      --muted: #6b6254;
      --faint: #9a9081;
      --line: #e6e0d4;
      --line-soft: #eee8dc;
      --button-line: #d4cbb9;
      --pending: #a4550f;
      --pending-bg: #f3e3cd;
      --confirmed: #3d7a4a;
      --danger: #c9503f;
      --danger-dark: #a63a2b;
      --danger-copy: #7a4238;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Arial, sans-serif;
      --serif: var(--sans);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }
    button, input, select, textarea, a {
      font: inherit;
    }
    button, .button-link {
      appearance: none;
      min-height: 38px;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      padding: 8px 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary, .button-link.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button.danger {
      color: var(--danger);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--button-line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
    }
    input, select { min-height: 36px; }
    textarea {
      min-height: 86px;
      resize: vertical;
      line-height: 1.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b89254;
      box-shadow: 0 0 0 3px rgba(184, 146, 84, .14);
    }
    .hidden { display: none !important; }

    .auth-page {
      min-height: 100%;
      padding: 28px;
    }
    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto 18px;
    }
    .auth-header h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      line-height: 1.2;
    }
    .auth-header p,
    .auth-copy {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .auth-card {
      width: min(620px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 26px;
    }
    .auth-title {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
    }
    .auth-card label {
      display: block;
      margin: 16px 0 6px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .auth-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .inbox-app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--paper);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 66px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 14px 20px 12px;
    }
    .top-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }
    .top-title h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .top-title span {
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .top-actions input {
      width: 220px;
      min-height: 34px;
      background: transparent;
    }
    .top-actions button,
    .top-actions .button-link {
      min-height: 34px;
      padding: 6px 10px;
      background: transparent;
      font-size: 12px;
    }
    .filterbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 46px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 0 20px;
    }
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .filter-tab {
      min-height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .filter-tab.active {
      color: var(--ink);
    }
    .filter-tab span {
      color: var(--faint);
      font-weight: 600;
    }
    .sort-label {
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
    }
    .message {
      display: none;
      border-bottom: 1px solid var(--line);
      background: #fffaf1;
      color: var(--muted);
      padding: 10px 20px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .message.show { display: block; }
    .message.error {
      background: #fff4f1;
      color: var(--danger-dark);
    }
    .message.success {
      background: #f5fbf3;
      color: var(--confirmed);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 400px minmax(0, 1fr) 260px;
      overflow: hidden;
    }
    .list-pane,
    .reading-pane,
    .meta-sidebar {
      min-height: 0;
      overflow-y: auto;
    }
    .list-pane {
      border-right: 1px solid var(--line);
      background: var(--paper);
    }
    .submission-list {
      display: grid;
    }
    .submission-item {
      display: block;
      width: 100%;
      min-height: 112px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-left: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      padding: 14px 16px 13px;
      text-align: left;
      white-space: normal;
    }
    .submission-item.active {
      border-left-color: var(--ink);
      background: var(--panel);
    }
    .submission-item.confirmed {
      opacity: .6;
    }
    .item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .item-title {
      min-width: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }
    .submission-item.active .item-title {
      font-weight: 700;
    }
    .item-time {
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 11px;
      font-weight: 500;
    }
    .item-meta {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .status-word.pending { color: var(--pending); }
    .status-word.confirmed { color: var(--confirmed); }
    .item-summary {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.6;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .empty-list,
    .empty-detail {
      padding: 24px;
      color: var(--faint);
      font-size: 13px;
    }
    .reading-pane {
      background: var(--paper);
      padding: 28px 36px 42px;
    }
    .reading-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .detail-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .detail-title-row h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-badge.pending {
      background: var(--pending-bg);
      color: var(--pending);
    }
    .status-badge.confirmed {
      background: #dfeadf;
      color: var(--confirmed);
    }
    .detail-meta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .image-strip {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin: 12px 0 24px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .image-button {
      appearance: none;
      display: block;
      min-height: 0;
      border: 0;
      border-radius: 6px;
      background: #eee7da;
      padding: 0;
      overflow: hidden;
      cursor: zoom-in;
    }
    .image-button.main img {
      width: 190px;
      height: 132px;
    }
    .image-button img {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: cover;
    }
    .section-block {
      margin: 0 0 22px;
    }
    .supplier-block {
      margin: 0 0 26px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }
    .supplier-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }
    .supplier-head h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .supplier-edit-toggle {
      min-height: 30px;
      padding: 5px 9px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .supplier-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 16px;
      margin: 0 0 20px;
    }
    .fact-item {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .fact-item span {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
    }
    .fact-item b {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .supplier-edit-panel {
      margin-top: 18px;
      border-top: 1px solid var(--line-soft);
      padding-top: 18px;
    }
    .section-block h3,
    .edit-panel h3 {
      margin: 0 0 9px;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .section-copy {
      margin: 0;
      color: var(--body);
      font-size: 14px;
      line-height: 1.85;
      overflow-wrap: anywhere;
    }
    .section-block.critical {
      border-top: 2px solid var(--danger);
      padding-top: 10px;
    }
    .section-block.critical h3 {
      color: var(--danger-dark);
    }
    .section-block.critical .section-copy {
      color: var(--danger-copy);
    }
    .edit-panel {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .edit-grid .span-2 { grid-column: 1 / -1; }
    .field-label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .field-label input,
    .field-label select,
    .field-label textarea {
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
    }
    .meta-sidebar {
      border-left: 1px solid var(--line);
      background: var(--side);
      padding: 22px 16px 28px;
    }
    .meta-actions {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }
    .meta-actions button,
    .meta-actions .button-link {
      width: 100%;
      justify-content: center;
      text-align: center;
    }
    .meta-divider {
      border-top: 1px solid var(--line);
      margin: 18px 0;
    }
    .kv-list {
      display: grid;
      gap: 13px;
    }
    .kv-item {
      display: grid;
      gap: 4px;
    }
    .kv-item label,
    .kv-item span {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
    }
    .kv-item b {
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .kv-item input,
    .kv-item select {
      min-height: 34px;
      font-size: 12.5px;
      font-weight: 500;
    }
    .import-state {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }
    .import-state.ok { color: var(--confirmed); }
    .import-state.warn { color: var(--danger); }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(43, 38, 32, .72);
      padding: 28px;
    }
    .lightbox.hidden { display: none; }
    .lightbox button {
      position: absolute;
      top: 18px;
      right: 18px;
      border-color: rgba(255, 255, 255, .4);
      background: rgba(43, 38, 32, .72);
      color: #fff;
    }
    .lightbox img {
      max-width: min(980px, 92vw);
      max-height: 86vh;
      border-radius: 6px;
      object-fit: contain;
      background: #fff;
    }
    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 360px minmax(0, 1fr);
      }
      .meta-sidebar {
        grid-column: 2;
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }
    @media (max-width: 780px) {
      .inbox-app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
      .topbar,
      .filterbar {
        align-items: stretch;
        flex-direction: column;
      }
      .top-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .top-actions input {
        grid-column: 1 / -1;
        width: 100%;
      }
      .workspace {
        display: block;
        overflow: visible;
      }
      .list-pane,
      .reading-pane,
      .meta-sidebar {
        overflow: visible;
      }
      .list-pane {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .reading-pane {
        padding: 22px 18px 28px;
      }
      .edit-grid {
        grid-template-columns: 1fr;
      }
      .supplier-facts {
        grid-template-columns: 1fr 1fr;
      }
      .meta-sidebar {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <section class="auth-page hidden" id="loginPanel">
    <div class="auth-header">
      <div>
        <h1>产品信息收件箱</h1>
        <p>Category Lab 内部资料，只在登录后显示。</p>
      </div>
      <a class="button-link" href="/decks/category-lab/categorylab">打开 Category Lab</a>
    </div>
    <div class="auth-card hidden" id="sessionGate">
      <p class="auth-title">收件箱已锁定</p>
      <p class="auth-copy" id="sessionGateText">当前浏览器已有登录态。进入前请确认周围环境。</p>
      <div class="auth-actions">
        <button class="primary" id="unlockBtn" type="button">进入收件箱</button>
        <button class="danger" id="sessionLogoutBtn" type="button">退出登录</button>
      </div>
    </div>
    <form class="auth-card" id="loginForm">
      <p class="auth-title">登录收件箱</p>
      <p class="auth-copy">内部资料只在登录后显示。离开电脑前请退出登录。</p>
      <label for="email">账号</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="auth-actions">
        <button class="primary" type="submit">登录</button>
      </div>
    </form>
  </section>

  <section class="inbox-app hidden" id="appPanel">
    <header class="topbar">
      <div class="top-title">
        <h1>产品信息收件箱</h1>
        <span>Category Lab 内部 · 最后刷新 <b id="lastRefreshText">--</b></span>
      </div>
      <div class="top-actions">
        <input id="searchInput" type="search" placeholder="搜索供应商、产品、摘要">
        <button id="loadBtn" type="button">刷新</button>
        <button id="exportBtn" type="button">导出 CSV</button>
        <button class="danger hidden" id="logoutBtn" type="button">退出登录</button>
      </div>
    </header>
    <div class="filterbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-status-filter="待处理" type="button">待处理 <span id="pendingCount">0</span></button>
        <button class="filter-tab" data-status-filter="已确认" type="button">已确认 <span id="confirmedCount">0</span></button>
        <button class="filter-tab" data-status-filter="已导入" type="button">已导入 Category Lab <span id="importedCount">0</span></button>
        <button class="filter-tab" data-status-filter="" type="button">全部 <span id="allCount">0</span></button>
      </div>
      <div class="sort-label">按提交时间排序 ↓</div>
    </div>
    <div class="message" id="message"></div>
    <div class="workspace">
      <aside class="list-pane">
        <div class="submission-list" id="submissionList"></div>
      </aside>
      <main class="reading-pane">
        <div class="reading-inner" id="detailPane"></div>
      </main>
      <aside class="meta-sidebar" id="metaPanel"></aside>
    </div>
  </section>

  <div class="lightbox hidden" id="lightbox">
    <button type="button" id="lightboxClose">关闭</button>
    <img id="lightboxImage" alt="产品照片放大预览">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./cloudbase-config.js"></script>
  <script>
    const TABLE = "supplier_feedback_records";
    const CATEGORYLAB_STORAGE_KEY = "burger-bom-tool-v1";
    const CAMPAIGN_OPTIONS = [
      "0106 Q1 烘焙换新",
      "0106 Q2 三明治换新",
      "0226 芝士分子周年庆",
      "0326 创世巨星",
      "0326 Q2烘焙换新",
      "0326 Q2三明治换新",
      "0430 云南档期 1",
      "0528 云南档期 2",
      "0702 Q3烘焙换新",
      "0702 Q3三明治换新",
      "0806 桂花档期",
      "0924 大航海家",
      "0924 Q4烘焙换新",
      "0924 Q4三明治换新",
      "1105 迪克森少校 1",
      "1208 迪克森少校 2"
    ];
    const config = window.CATEGORYLAB_SUPABASE || {};
    const cloudbaseConfig = window.CATEGORYLAB_CLOUDBASE || {};
    const cloudbaseHost = /tcloudbase|cloudbase|tencent/i.test(location.hostname) || new URLSearchParams(location.search).get("backend") === "cloudbase";
    const cloudbaseReady = Boolean(cloudbaseConfig.apiUrl) && cloudbaseHost;
    const supabaseReady = Boolean(config.url && config.anonKey && window.supabase);
    const client = supabaseReady ? window.supabase.createClient(config.url, config.anonKey) : null;

    const loginPanel = document.querySelector("#loginPanel");
    const appPanel = document.querySelector("#appPanel");
    const loginForm = document.querySelector("#loginForm");
    const sessionGate = document.querySelector("#sessionGate");
    const sessionGateText = document.querySelector("#sessionGateText");
    const unlockBtn = document.querySelector("#unlockBtn");
    const sessionLogoutBtn = document.querySelector("#sessionLogoutBtn");
    const searchInput = document.querySelector("#searchInput");
    const loadBtn = document.querySelector("#loadBtn");
    const exportBtn = document.querySelector("#exportBtn");
    const logoutBtn = document.querySelector("#logoutBtn");
    const message = document.querySelector("#message");
    const listEl = document.querySelector("#submissionList");
    const detailPane = document.querySelector("#detailPane");
    const metaPanel = document.querySelector("#metaPanel");
    const lastRefreshText = document.querySelector("#lastRefreshText");
    const lightbox = document.querySelector("#lightbox");
    const lightboxImage = document.querySelector("#lightboxImage");
    const lightboxClose = document.querySelector("#lightboxClose");
    const countEls = {
      pending: document.querySelector("#pendingCount"),
      confirmed: document.querySelector("#confirmedCount"),
      imported: document.querySelector("#importedCount"),
      all: document.querySelector("#allCount")
    };

    let records = [];
    let profile = null;
    let activeRecordId = new URLSearchParams(location.search).get("id") || "";
    let statusFilter = "待处理";
    let supplierEditOpen = false;
    let cloudbaseAdminCode = sessionStorage.getItem("categorylabCloudbaseAdminCode") || "";

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", " ");
    }

    function nl(value) {
      return escapeHtml(value).replace(/\n/g, "<br>");
    }

    function compactText(value, fallback = "-") {
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    function dateText(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function relativeTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const diff = Date.now() - date.getTime();
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return "刚刚";
      if (minutes < 60) return `${minutes} 分钟前`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天前`;
      return `${date.getMonth() + 1}/${String(date.getDate()).padStart(2, "0")}`;
    }

    function roleCanEdit() {
      return ["owner", "pm"].includes(profile?.role);
    }

    function cloudbaseImageUrl(fileID) {
      if (!fileID || !cloudbaseConfig.apiUrl) return "";
      const url = new URL(cloudbaseConfig.apiUrl);
      url.searchParams.set("action", "image");
      url.searchParams.set("fileID", fileID);
      return url.toString();
    }

    function imageUrls(row) {
      return Array.isArray(row.image_paths)
        ? row.image_paths.map(image => cloudbaseImageUrl(image.fileID) || image.publicUrl || image.url).filter(Boolean)
        : [];
    }

    async function cloudbaseRequest(action, payload = {}) {
      const response = await fetch(cloudbaseConfig.apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CategoryLab-Admin-Code": cloudbaseAdminCode
        },
        body: JSON.stringify({ action, adminCode: cloudbaseAdminCode, ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || `请求失败（${response.status}）`);
      }
      return result.data;
    }

    function optionHtml(options, selected) {
      return options.map(option => `<option value="${escapeAttr(option)}" ${option === selected ? "selected" : ""}>${escapeHtml(option || "请选择")}</option>`).join("");
    }

    function fieldInput(field, value, placeholder = "", type = "text") {
      return `<input data-field="${escapeAttr(field)}" type="${escapeAttr(type)}" value="${escapeAttr(value || "")}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>`;
    }

    function fieldTextarea(field, value, placeholder = "", rows = 3) {
      return `<textarea data-field="${escapeAttr(field)}" rows="${rows}" placeholder="${escapeAttr(placeholder)}" ${roleCanEdit() ? "" : "disabled"}>${escapeHtml(value || "")}</textarea>`;
    }

    function fieldSelect(field, options, selected) {
      return `<select data-field="${escapeAttr(field)}" ${roleCanEdit() ? "" : "disabled"}>${optionHtml(options, selected || "")}</select>`;
    }

    function fieldBlock(label, control, extraClass = "") {
      return `<label class="field-label ${extraClass}"><span>${escapeHtml(label)}</span>${control}</label>`;
    }

    function kv(label, value) {
      return `<div class="kv-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(compactText(value))}</b></div>`;
    }

    function editableKv(label, field, value, placeholder = "", type = "text") {
      return `<div class="kv-item"><label>${escapeHtml(label)}</label>${fieldInput(field, value, placeholder, type)}</div>`;
    }

    function categoryLabData() {
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function campaignOptions() {
      return ["", ...CAMPAIGN_OPTIONS];
    }

    function isImportedToCategoryLab(row) {
      const data = categoryLabData();
      const devRecords = Array.isArray(data?.devRecords) ? data.devRecords : [];
      return devRecords.some(item => item.supplierSubmissionId === row.id || item.id === `supplier-${row.id}`);
    }

    function visibleRecords() {
      const q = searchInput.value.trim().toLowerCase();
      return records.filter(row => {
        const statusOk = statusFilter === "已导入"
          ? isImportedToCategoryLab(row)
          : (!statusFilter || row.status === statusFilter);
        const haystack = [
          row.product_name,
          row.supplier_name,
          row.version_label,
          row.product_type,
          row.test_category,
          row.campaign,
          row.version_change,
          row.finished_spec,
          row.ingredients_structure,
          row.core_ingredients_selling_points,
          row.tasting_feedback,
          row.next_step_direction,
          row.key_blocker
        ].join(" ").toLowerCase();
        return statusOk && (!q || haystack.includes(q));
      });
    }

    function recordById(id) {
      return records.find(row => row.id === id) || null;
    }

    function activeRecord() {
      return recordById(activeRecordId);
    }

    function syncUrl() {
      const url = new URL(location.href);
      if (activeRecordId) url.searchParams.set("id", activeRecordId);
      else url.searchParams.delete("id");
      history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
    }

    function ensureActive(preferredId = activeRecordId) {
      const rows = visibleRecords();
      if (preferredId && rows.some(row => row.id === preferredId)) {
        activeRecordId = preferredId;
      } else {
        activeRecordId = rows[0]?.id || "";
      }
      syncUrl();
    }

    function renderCounts() {
      const pending = records.filter(row => row.status === "待处理").length;
      const confirmed = records.filter(row => row.status === "已确认").length;
      const imported = records.filter(row => isImportedToCategoryLab(row)).length;
      countEls.pending.textContent = pending;
      countEls.confirmed.textContent = confirmed;
      countEls.imported.textContent = imported;
      countEls.all.textContent = records.length;
      document.querySelectorAll("[data-status-filter]").forEach(button => {
        button.classList.toggle("active", button.dataset.statusFilter === statusFilter);
      });
    }

    function submissionNumber(row) {
      const same = records
        .filter(item => (item.supplier_name || "") === (row.supplier_name || "") && (item.product_name || "") === (row.product_name || ""))
        .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
      return Math.max(1, same.findIndex(item => item.id === row.id) + 1);
    }

    function statusClass(row) {
      return row.status === "已确认" ? "confirmed" : "pending";
    }

    function renderList() {
      const rows = visibleRecords();
      if (!rows.length) {
        listEl.innerHTML = `<div class="empty-list">暂无匹配记录。</div>`;
        return;
      }
      listEl.innerHTML = rows.map(row => `
        <button class="submission-item ${row.id === activeRecordId ? "active" : ""} ${row.status === "已确认" ? "confirmed" : ""}" data-record-id="${escapeAttr(row.id)}" type="button">
          <span class="item-head">
            <span class="item-title">${escapeHtml(compactText(row.product_name, "未命名产品"))}</span>
            <span class="item-time">${escapeHtml(relativeTime(row.created_at))}</span>
          </span>
          <span class="item-meta">
            ${escapeHtml(compactText(row.supplier_name, "未知供应商"))}
            · ${escapeHtml(compactText(row.product_type || row.test_category, "未分类"))}
            · <span class="status-word ${statusClass(row)}">${escapeHtml(row.status || "待处理")}</span>
          </span>
          <span class="item-summary">${escapeHtml(compactText(row.version_change || row.core_ingredients_selling_points || row.ingredients_structure, "暂无摘要"))}</span>
        </button>
      `).join("");
    }

    function renderImageStrip(row) {
      const imgs = imageUrls(row);
      if (!imgs.length) return "";
      return `
        <div class="image-strip">
          ${imgs.map((url, index) => `
            <button class="image-button ${index === 0 ? "main" : ""}" data-image-url="${escapeAttr(url)}" type="button">
              <img src="${escapeAttr(url)}" alt="产品照 ${index + 1}">
            </button>
          `).join("")}
        </div>
      `;
    }

    function sectionHtml(title, value, className = "") {
      const text = String(value || "").trim();
      if (!text) return "";
      return `<section class="section-block ${className}"><h3>${escapeHtml(title)}</h3><p class="section-copy">${nl(text)}</p></section>`;
    }

    function factItem(label, value) {
      return `<div class="fact-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(compactText(value))}</b></div>`;
    }

    function renderSupplierEditPanel(row) {
      if (!supplierEditOpen) return "";
      return `
        <div class="supplier-edit-panel">
          <div class="edit-grid">
            ${fieldBlock("供应商", fieldInput("supplier_name", row.supplier_name, "供应商"))}
            ${fieldBlock("品名", fieldInput("product_name", row.product_name, "品名"))}
            ${fieldBlock("版本", fieldInput("version_label", row.version_label, "V1 / V2 / V3"))}
            ${fieldBlock("成品规格（克）", fieldInput("finished_spec", row.finished_spec, "如：165g/份"))}
            ${fieldBlock("类型", fieldSelect("product_type", ["", "烘焙", "蛋糕", "三明治", "预包装食品"], row.product_type))}
            ${fieldBlock("测试类别", fieldSelect("test_category", ["", "档期测试", "新品提案"], row.test_category))}
            ${fieldBlock("送样时间", fieldInput("sample_date", row.sample_date, "YYYY-MM-DD", "date"))}
            ${fieldBlock("本版调整点", fieldTextarea("version_change", row.version_change, "本版调整点", 3), "span-2")}
            ${fieldBlock("产品结构", fieldTextarea("ingredients_structure", row.ingredients_structure, "产品结构", 3), "span-2")}
            ${fieldBlock("核心原料及卖点", fieldTextarea("core_ingredients_selling_points", row.core_ingredients_selling_points, "核心原料及卖点", 3), "span-2")}
          </div>
        </div>
      `;
    }

    function renderSupplierBlock(row) {
      return `
        <section class="supplier-block">
          <div class="supplier-head">
            <h3>供应商提交内容</h3>
            <button class="supplier-edit-toggle" data-toggle-supplier-edit type="button" ${roleCanEdit() ? "" : "disabled"}>${supplierEditOpen ? "收起校准" : "编辑供应商信息"}</button>
          </div>
          <div class="supplier-facts">
            ${factItem("供应商", row.supplier_name)}
            ${factItem("品名", row.product_name)}
            ${factItem("版本", row.version_label)}
            ${factItem("成品规格（克）", row.finished_spec)}
            ${factItem("类型", row.product_type)}
            ${factItem("测试类别", row.test_category)}
            ${factItem("送样时间", row.sample_date)}
          </div>
          ${sectionHtml("本版调整点", row.version_change)}
          ${sectionHtml("产品结构", row.ingredients_structure)}
          ${sectionHtml("核心原料及卖点", row.core_ingredients_selling_points)}
          ${renderSupplierEditPanel(row)}
        </section>
      `;
    }

    function renderDetail() {
      const row = activeRecord();
      if (!row) {
        detailPane.innerHTML = `<div class="empty-detail">请选择左侧记录。</div>`;
        metaPanel.innerHTML = "";
        return;
      }
      const badgeClass = statusClass(row);
      detailPane.innerHTML = `
        <div class="detail-title-row">
          <h2>${escapeHtml(compactText(row.product_name, "未命名产品"))}</h2>
          <span class="status-badge ${badgeClass}">${escapeHtml(row.status || "待处理")}</span>
        </div>
        <p class="detail-meta">
          ${escapeHtml(compactText(row.supplier_name, "未知供应商"))}
          ${row.product_type ? `（${escapeHtml(row.product_type)}）` : ""}
          · ${escapeHtml(compactText(row.test_category, "未填测试类别"))}
          · ${escapeHtml(compactText(row.version_label, "未填版本"))}
          · ${escapeHtml(dateText(row.created_at))}
          · 第 ${submissionNumber(row)} 次提交
        </p>
        ${renderImageStrip(row)}
        ${renderSupplierBlock(row)}
        <section class="edit-panel">
          <h3>产品经理补充测试结果</h3>
          <div class="edit-grid">
            ${fieldBlock("报价（元，含税含运）", fieldInput("quote_rmb", row.quote_rmb, "线下确认后填写"))}
            ${fieldBlock("档期名称", fieldSelect("campaign", campaignOptions(row.campaign), row.campaign))}
            ${fieldBlock("测试场景 / 反馈来源", fieldSelect("tasting_scene", ["", "前期打磨测试", "众测后优化", "中试后优化", "上市后优化"], row.tasting_scene))}
            ${fieldBlock("本轮结论", fieldSelect("round_conclusion", ["", "继续调整", "暂停", "通过且储备", "通过且进入众测"], row.round_conclusion))}
            ${fieldBlock("测试反馈", fieldTextarea("tasting_feedback", row.tasting_feedback, "测试反馈", 4), "span-2")}
            ${fieldBlock("下一步改进方向", fieldTextarea("next_step_direction", row.next_step_direction, "下一步改进方向", 3), "span-2")}
            ${fieldBlock("关键卡点 / 备注", fieldTextarea("key_blocker", row.key_blocker, "关键卡点 / 备注", 3), "span-2")}
          </div>
        </section>
      `;
      renderMeta(row);
    }

    function renderMeta(row) {
      const imported = isImportedToCategoryLab(row);
      const importText = imported ? "已导入 Category Lab" : "未导入 Category Lab";
      const importClass = imported ? "import-state ok" : row.status === "已确认" ? "import-state warn" : "import-state";
      metaPanel.innerHTML = `
        <div class="meta-actions">
          <button class="primary" data-confirm-active type="button" ${roleCanEdit() ? "" : "disabled"}>确认提交</button>
          <button data-save-active type="button" ${roleCanEdit() ? "" : "disabled"}>保存修改</button>
          <button data-import-active type="button" ${roleCanEdit() ? "" : "disabled"}>${imported ? "更新导入 Category Lab" : "导入 Category Lab"}</button>
          <button class="danger" data-delete-active type="button" ${roleCanEdit() ? "" : "disabled"}>删除记录</button>
        </div>
        <div class="meta-divider"></div>
        <div class="kv-list">
          ${kv("供应商", row.supplier_name)}
          ${kv("送样时间", row.sample_date)}
          ${kv("类型", row.product_type)}
          ${kv("测试类别", row.test_category)}
          ${kv("档期名称", row.campaign)}
          ${kv("版本", row.version_label)}
          ${kv("成品规格（克）", row.finished_spec)}
          <div class="${importClass}">${escapeHtml(importText)}</div>
          ${kv("提交编号", row.followup_code)}
          ${kv("提交时间", dateText(row.created_at))}
          ${kv("更新时间", dateText(row.updated_at))}
        </div>
      `;
    }

    function renderAll(preferredId = activeRecordId) {
      renderCounts();
      ensureActive(preferredId);
      renderList();
      renderDetail();
    }

    function resetInMemoryState() {
      profile = null;
      records = [];
      activeRecordId = "";
      listEl.innerHTML = `<div class="empty-list">暂无数据。</div>`;
      detailPane.innerHTML = "";
      metaPanel.innerHTML = "";
      renderCounts();
    }

    function showLoginForm() {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.remove("hidden");
      sessionGate.classList.add("hidden");
      appPanel.classList.add("hidden");
    }

    function showSessionGate(session) {
      resetInMemoryState();
      loginPanel.classList.remove("hidden");
      loginForm.classList.add("hidden");
      sessionGate.classList.remove("hidden");
      appPanel.classList.add("hidden");
      sessionGateText.textContent = `当前登录账号：${session?.user?.email || "内部账号"}。进入前请确认周围环境。`;
    }

    function showAppShell() {
      loginPanel.classList.add("hidden");
      appPanel.classList.remove("hidden");
    }

    async function logout() {
      if (cloudbaseReady) {
        sessionStorage.removeItem("categorylabCloudbaseAdminCode");
        cloudbaseAdminCode = "";
      } else if (client) {
        await client.auth.signOut();
      }
      clearMessage();
      showLoginForm();
      loginForm.elements.password.value = "";
      loginForm.elements.email.focus();
    }

    async function loadProfile(session) {
      if (cloudbaseReady) return;
      const { data, error } = await client
        .from("categorylab_profiles")
        .select("*")
        .eq("id", session.user.id)
        .single();
      if (error) throw error;
      profile = data;
    }

    async function loadRecords() {
      if (!profile) return;
      loadBtn.disabled = true;
      loadBtn.textContent = "读取中...";
      clearMessage();
      try {
        if (cloudbaseReady) {
          const data = await cloudbaseRequest("adminList");
          records = data.records || [];
        } else {
          const { data, error } = await client
            .from(TABLE)
            .select("*")
            .order("created_at", { ascending: false });
          if (error) throw error;
          records = data || [];
        }
        records.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
        lastRefreshText.textContent = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
        renderAll(activeRecordId);
        const missingImport = records.filter(row => row.status === "已确认" && !isImportedToCategoryLab(row)).length;
        if (missingImport > 0) showMessage(`有 ${missingImport} 条已确认记录还没有导入 Category Lab。`, "");
      } catch (error) {
        showMessage(error.message || "读取失败。", "error");
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = "刷新";
      }
    }

    async function boot({ unlock = false } = {}) {
      if (cloudbaseReady) {
        profile = { display_name: "Louise", role: "owner" };
        showAppShell();
        await loadRecords();
        return;
      }
      if (!supabaseReady) {
        showLoginForm();
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const { data } = await client.auth.getSession();
      if (!data.session) {
        showLoginForm();
        return;
      }
      if (!unlock) {
        showSessionGate(data.session);
        return;
      }
      await loadProfile(data.session);
      showAppShell();
      await loadRecords();
    }

    function detailValue(field, fallback = "") {
      const node = appPanel.querySelector(`[data-field="${CSS.escape(field)}"]`);
      return node ? node.value : String(fallback ?? "");
    }

    function activePayload() {
      const row = activeRecord() || {};
      const quoteText = detailValue("quote_rmb", row.quote_rmb ?? "").trim();
      const quoteCleaned = quoteText.replace(/[^0-9.]/g, "");
      const quote = Number(quoteCleaned);
      return {
        product_name: detailValue("product_name", row.product_name || "").trim() || row.product_name || "",
        supplier_name: detailValue("supplier_name", row.supplier_name || "").trim() || row.supplier_name || "",
        version_label: detailValue("version_label", row.version_label || "").trim(),
        sample_date: detailValue("sample_date", row.sample_date || "").trim() || null,
        product_type: detailValue("product_type", row.product_type || "").trim(),
        test_category: detailValue("test_category", row.test_category || "").trim(),
        campaign: detailValue("campaign", row.campaign || "").trim(),
        version_change: detailValue("version_change", row.version_change || "").trim(),
        finished_spec: detailValue("finished_spec", row.finished_spec || "").trim(),
        ingredients_structure: detailValue("ingredients_structure", row.ingredients_structure || "").trim(),
        quote_rmb: quoteCleaned && Number.isFinite(quote) ? quote : null,
        core_ingredients_selling_points: detailValue("core_ingredients_selling_points", row.core_ingredients_selling_points || "").trim(),
        tasting_scene: detailValue("tasting_scene", row.tasting_scene || ""),
        tasting_feedback: detailValue("tasting_feedback", row.tasting_feedback || "").trim(),
        round_conclusion: detailValue("round_conclusion", row.round_conclusion || ""),
        next_step_direction: detailValue("next_step_direction", row.next_step_direction || "").trim(),
        key_blocker: detailValue("key_blocker", row.key_blocker || "").trim(),
        status: row.status || "待处理"
      };
    }

    async function saveRow(id = activeRecordId, override = {}) {
      if (!roleCanEdit() || !id) return null;
      const payload = { ...activePayload(), ...override };
      let data;
      if (cloudbaseReady) {
        const response = await cloudbaseRequest("adminUpdate", { id, payload });
        data = response.record;
      } else {
        const response = await client
          .from(TABLE)
          .update(payload)
          .eq("id", id)
          .select("*")
          .single();
        if (response.error) throw response.error;
        data = response.data;
      }
      const index = records.findIndex(row => row.id === id);
      if (index >= 0) records[index] = data;
      renderAll(id);
      return data;
    }

    function categoryLabRecord(row) {
      const tastingSummary = [
        row.round_conclusion ? `本轮结论：${row.round_conclusion}` : "",
        row.tasting_feedback ? `测试反馈：${row.tasting_feedback}` : ""
      ].filter(Boolean).join("\n");
      return {
        id: `supplier-${row.id}`,
        time: row.created_at ? dateText(row.created_at) : new Date().toLocaleString("zh-CN"),
        category: row.product_type || "",
        campaign: row.campaign || "",
        project: row.product_name || "",
        supplier: row.supplier_name || "",
        brand: "",
        spec: row.finished_spec || "",
        price: row.quote_rmb || "",
        weight: "",
        length: "",
        width: "",
        height: "",
        version: row.version_label || "V1",
        testDate: row.sample_date || "",
        type: "OEM 品类测试",
        images: imageUrls(row),
        image: imageUrls(row)[0] || "",
        overallEvaluation: tastingSummary,
        sensory: {
          appearance: "",
          appearanceScore: "",
          aroma: "",
          aromaScore: "",
          flavor: row.tasting_feedback || "",
          flavorScore: "",
          texture: "",
          textureScore: ""
        },
        materials: row.ingredients_structure || "",
        yield: {},
        note: row.next_step_direction || "",
        supplierSubmissionId: row.id,
        supplierSubmissionSummary: [
          row.followup_code ? `提交编号：${row.followup_code}` : "",
          row.product_type ? `产品类型：${row.product_type}` : "",
          row.test_category ? `测试类别：${row.test_category}` : "",
          row.campaign ? `档期名称：${row.campaign}` : "",
          row.version_change ? `本版调整点：${row.version_change}` : "",
          row.core_ingredients_selling_points ? `核心原料及卖点：${row.core_ingredients_selling_points}` : "",
          row.key_blocker ? `关键卡点 / 备注：${row.key_blocker}` : ""
        ].filter(Boolean).join("\n")
      };
    }

    async function importToCategoryLab(id = activeRecordId) {
      if (!roleCanEdit() || !id) return;
      const row = recordById(id);
      if (!row) return;
      const mergedRow = { ...row, ...activePayload(), status: "已确认" };
      const raw = localStorage.getItem(CATEGORYLAB_STORAGE_KEY);
      if (!raw) {
        showMessage("当前浏览器还没有 Category Lab 本地数据。请先打开一次 Category Lab，再回来导入。", "error");
        return;
      }
      let data;
      try {
        data = JSON.parse(raw);
      } catch (error) {
        showMessage("Category Lab 本地数据无法读取，未导入。", "error");
        return;
      }
      data.devRecords = Array.isArray(data.devRecords) ? data.devRecords : [];
      const record = categoryLabRecord(mergedRow);
      const index = data.devRecords.findIndex(item => item.supplierSubmissionId === id || item.id === record.id);
      if (index >= 0) data.devRecords[index] = { ...data.devRecords[index], ...record };
      else data.devRecords.unshift(record);
      localStorage.setItem(CATEGORYLAB_STORAGE_KEY, JSON.stringify(data));
      const updated = await saveRow(id, { ...mergedRow, status: "已确认" });
      showMessage(`已导入 Category Lab：${updated?.product_name || mergedRow.product_name || ""}`, "success");
    }

    async function deleteRow(id = activeRecordId) {
      if (!roleCanEdit() || !id) return;
      const row = recordById(id);
      const ok = window.confirm(`确认删除这条产品信息？\n${row?.product_name || ""}`);
      if (!ok) return;
      if (cloudbaseReady) {
        await cloudbaseRequest("adminDelete", { id });
      } else {
        const { error } = await client
          .from(TABLE)
          .delete()
          .eq("id", id);
        if (error) throw error;
      }
      records = records.filter(item => item.id !== id);
      renderAll("");
      showMessage("已删除。", "success");
    }

    function csvEscape(value) {
      const text = String(value || "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const headers = [
        "品名",
        "供应商",
        "版本",
        "提交编号",
        "送样时间",
        "产品类型",
        "测试类别",
        "档期名称",
        "本版调整点",
        "成品规格（克）",
        "产品结构",
        "产品照",
        "测试场景 / 反馈来源",
        "测试反馈",
        "本轮结论",
        "下一步改进方向",
        "报价（元，含税含运）",
        "核心原料及卖点",
        "关键卡点 / 备注",
        "Category Lab 导入",
        "状态"
      ];
      const rows = visibleRecords().map(row => [
        row.product_name,
        row.supplier_name,
        row.version_label,
        row.followup_code,
        row.sample_date,
        row.product_type,
        row.test_category,
        row.campaign,
        row.version_change,
        row.finished_spec,
        row.ingredients_structure,
        imageUrls(row).join(" "),
        row.tasting_scene,
        row.tasting_feedback,
        row.round_conclusion,
        row.next_step_direction,
        row.quote_rmb,
        row.core_ingredients_selling_points,
        row.key_blocker,
        isImportedToCategoryLab(row) ? "已导入 Category Lab" : "未导入 Category Lab",
        row.status
      ]);
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `产品信息收件箱_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function moveSelection(delta) {
      const rows = visibleRecords();
      if (!rows.length) return;
      const index = Math.max(0, rows.findIndex(row => row.id === activeRecordId));
      const next = rows[Math.min(rows.length - 1, Math.max(0, index + delta))];
      if (next) {
        activeRecordId = next.id;
        renderAll(next.id);
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (cloudbaseReady) {
        cloudbaseAdminCode = loginForm.elements.password.value;
        try {
          const data = await cloudbaseRequest("adminLogin");
          sessionStorage.setItem("categorylabCloudbaseAdminCode", cloudbaseAdminCode);
          profile = data.profile;
          showAppShell();
          await loadRecords();
        } catch (error) {
          cloudbaseAdminCode = "";
          sessionStorage.removeItem("categorylabCloudbaseAdminCode");
          showMessage(error.message || "登录失败。", "error");
        }
        return;
      }
      if (!supabaseReady) {
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      const email = loginForm.elements.email.value.trim();
      const password = loginForm.elements.password.value;
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        const text = error.message || "登录失败。";
        showMessage(text.includes("Invalid login credentials") ? "账号或密码不正确。请用 Supabase 里创建的内部账号登录。" : text, "error");
        return;
      }
      await boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error"));
    });

    sessionLogoutBtn.addEventListener("click", logout);
    unlockBtn.addEventListener("click", () => boot({ unlock: true }).catch(error => showMessage(error.message || "加载失败。", "error")));
    logoutBtn.addEventListener("click", logout);
    loadBtn.addEventListener("click", loadRecords);
    exportBtn.addEventListener("click", exportCsv);
    searchInput.addEventListener("input", () => renderAll(""));
    document.querySelectorAll("[data-status-filter]").forEach(button => {
      button.addEventListener("click", () => {
        statusFilter = button.dataset.statusFilter;
        renderAll("");
      });
    });
    listEl.addEventListener("click", event => {
      const item = event.target.closest("[data-record-id]");
      if (!item) return;
      activeRecordId = item.dataset.recordId;
      supplierEditOpen = false;
      renderAll(activeRecordId);
    });
    appPanel.addEventListener("click", async event => {
      try {
        const imageButton = event.target.closest("[data-image-url]");
        if (imageButton) {
          lightboxImage.src = imageButton.dataset.imageUrl;
          lightbox.classList.remove("hidden");
          return;
        }
        if (event.target.closest("[data-toggle-supplier-edit]")) {
          supplierEditOpen = !supplierEditOpen;
          renderDetail();
          return;
        }
        if (event.target.closest("[data-save-active]")) {
          await saveRow();
          showMessage("已保存。", "success");
        }
        if (event.target.closest("[data-confirm-active]")) {
          await saveRow(activeRecordId, { status: "已确认" });
          showMessage("已确认。", "success");
        }
        if (event.target.closest("[data-import-active]")) await importToCategoryLab();
        if (event.target.closest("[data-delete-active]")) await deleteRow();
      } catch (error) {
        showMessage(error.message || "操作失败。", "error");
      }
    });
    lightboxClose.addEventListener("click", () => lightbox.classList.add("hidden"));
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) lightbox.classList.add("hidden");
    });
    document.addEventListener("keydown", async event => {
      const tag = event.target?.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        moveSelection(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveSelection(-1);
      } else if (event.key === "Enter" && activeRecordId && roleCanEdit()) {
        event.preventDefault();
        try {
          await saveRow(activeRecordId, { status: "已确认" });
          showMessage("已确认。", "success");
        } catch (error) {
          showMessage(error.message || "操作失败。", "error");
        }
      }
    });

    boot().catch(error => showMessage(error.message || "加载失败。", "error"));
  </script>
</body>
</html>
