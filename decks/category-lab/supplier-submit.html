<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="供应商提交">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/supplier-pwa-icon.svg">
  <link rel="icon" href="/assets/supplier-pwa-icon.svg" type="image/svg+xml">
  <title>供应商产品信息提交</title>
  <style>
    :root {
      --paper: #f7f3ea;
      --panel: #fffdf8;
      --line: #d7c7ad;
      --ink: #1d1a16;
      --muted: #756b5d;
      --accent: #1f6f5b;
      --danger: #b23b28;
      --shadow: 0 16px 42px rgba(34, 28, 18, 0.12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .status-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 253, 248, 0.72);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    form { padding: 22px; }
    .section {
      padding: 20px 0;
      border-top: 1px solid #eadfce;
    }
    .section:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 900;
    }
    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mode-button[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    .followup-summary {
      display: none;
      margin-top: 10px;
      border: 1px solid #eadfce;
      border-radius: 6px;
      background: #fff;
      padding: 10px 11px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .hidden { display: none !important; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #3e352b;
      font-size: 13px;
      font-weight: 900;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 10px 11px;
      outline: none;
    }
    input[type="date"] {
      min-height: 45px;
      line-height: 1.4;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"]::-webkit-date-and-time-value {
      min-height: 24px;
      text-align: left;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      margin-left: auto;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #b18a47;
      box-shadow: 0 0 0 3px rgba(177, 138, 71, 0.16);
    }
    select { min-height: 45px; }
    textarea {
      min-height: 98px;
      resize: vertical;
    }
    .field-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .product-list {
      display: grid;
      gap: 14px;
    }
    .product-card {
      border: 1px solid #eadfce;
      border-radius: 8px;
      background: #fffaf1;
      padding: 14px;
    }
    .product-card + .product-card {
      margin-top: 4px;
    }
    .product-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .product-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
    }
    .product-card .section-title {
      margin-top: 14px;
      font-size: 14px;
    }
    .product-fields {
      display: grid;
      gap: 14px;
    }
    .grid.product-main {
      grid-template-columns: minmax(240px, 1.65fr) minmax(118px, 0.7fr) minmax(150px, 0.82fr) minmax(170px, 1fr);
    }
    .grid.two.product-notes,
    .grid.two.feedback-pair {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .structure-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .weight-summary {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }
    .structure-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .structure-table th,
    .structure-table td {
      border: 1px solid #eadfce;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }
    .structure-table th {
      background: #f2eadc;
      color: #3e352b;
      font-size: 12px;
    }
    .structure-table .weight-cell { width: 150px; }
    .structure-table .action-cell { width: 82px; }
    .ghost-button {
      min-height: 36px;
      padding: 7px 10px;
    }
    .ghost-button.danger {
      color: var(--danger);
    }
    .spec-compare {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .preview-grid figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .preview-grid img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f1eadf;
    }
    .preview-grid figcaption {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid #eadfce;
    }
    button, .link-button {
      appearance: none;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      padding: 9px 14px;
      text-decoration: none;
    }
    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }
    .message {
      display: none;
      margin: 0 22px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: #fff;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.error {
      border-color: rgba(178, 59, 40, 0.42);
      background: #fff8f6;
      color: var(--danger);
    }
    .message.success {
      border-color: rgba(31, 111, 91, 0.42);
      background: #f6fffb;
      color: var(--accent);
    }
    .confirm-dialog {
      width: min(460px, calc(100vw - 36px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 0;
      box-shadow: var(--shadow);
    }
    .confirm-dialog::backdrop {
      background: rgba(29, 26, 22, 0.32);
    }
    .confirm-body {
      padding: 20px 20px 16px;
    }
    .confirm-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 900;
    }
    .confirm-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid #eadfce;
    }
    @media (max-width: 760px) {
      main {
        width: min(100vw - 22px, 1040px);
        padding-top: 18px;
      }
      header { display: block; }
      .status-pill {
        display: inline-block;
        margin-top: 12px;
      }
      form { padding: 16px; }
      .grid, .grid.two { grid-template-columns: 1fr; }
      .grid.product-main,
      .grid.two.product-notes,
      .grid.two.feedback-pair { grid-template-columns: 1fr; }
      .span-2, .span-3 { grid-column: auto; }
      .actions { justify-content: stretch; }
      button, .link-button { width: 100%; }
      .mode-switch { display: grid; }
      .structure-tools { align-items: stretch; }
      .weight-summary { width: 100%; margin-left: 0; }
      .structure-table { min-width: 560px; }
      .structure-builder { overflow-x: auto; }
      .confirm-actions { display: grid; }
    }
    @media (max-width: 520px) {
      main {
        width: 100%;
        padding: 12px 10px 22px;
      }
      h1 { font-size: 28px; }
      .eyebrow { font-size: 12px; }
      .panel {
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(34, 28, 18, 0.1);
      }
      form { padding: 12px; }
      .section { padding: 16px 0; }
      .product-card {
        padding: 12px;
        border-radius: 8px;
      }
      .product-card-header {
        align-items: stretch;
      }
      .product-card-header .ghost-button {
        width: auto;
        min-width: 86px;
      }
      input, select, textarea {
        min-height: 46px;
        font-size: 16px;
        padding: 10px;
      }
      textarea { min-height: 112px; }
      .structure-tools {
        display: grid;
        grid-template-columns: 1fr;
      }
      .structure-table {
        min-width: 0;
        table-layout: fixed;
        font-size: 13px;
      }
      .structure-table th,
      .structure-table td {
        padding: 6px;
      }
      .structure-table .weight-cell { width: 92px; }
      .structure-table .action-cell { width: 66px; }
      .structure-table .ghost-button {
        width: 100%;
        min-width: 0;
        padding: 7px 6px;
      }
      .structure-builder { overflow-x: visible; }
      .preview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .mobile-sticky-actions {
        position: sticky;
        bottom: 0;
        z-index: 8;
        margin: 0 -12px -12px;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        background: rgba(255, 253, 248, 0.96);
        backdrop-filter: blur(10px);
      }
      .message {
        margin: 0 12px 14px;
      }
      .confirm-dialog {
        width: calc(100vw - 24px);
      }
      .confirm-body {
        padding: 18px 16px 14px;
      }
      .confirm-actions {
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Category Lab Supplier Form</p>
        <h1>供应商产品信息提交</h1>
      </div>
    </header>

    <section class="panel">
      <form id="submissionForm">
        <div class="section">
          <p class="section-title">提交类型</p>
          <div class="mode-switch" role="group" aria-label="提交类型">
            <button class="mode-button" data-mode="create" type="button" aria-pressed="true">提交测试前资料</button>
            <button class="mode-button" data-mode="followup" type="button" aria-pressed="false">补充测试反馈</button>
          </div>
        </div>

        <div class="section hidden" data-followup-code-section>
          <p class="section-title">对应记录</p>
          <div class="grid two">
            <div>
              <label for="followupCode">提交编号 *</label>
              <input id="followupCode" name="followupCode" autocomplete="off" placeholder="第一段提交成功后显示的编号">
            </div>
          </div>
          <div class="followup-summary" id="followupSummary"></div>
        </div>

        <div class="section" data-mode-section="create">
          <p class="section-title">第一段：测试前资料</p>
          <div class="grid two">
            <div>
              <label for="supplierName">供应商 *</label>
              <input id="supplierName" name="supplierName" required autocomplete="organization" placeholder="供应商公司简称">
            </div>
            <div>
              <label for="sampleDate">送样时间 *</label>
              <input id="sampleDate" name="sampleDate" type="date" required>
            </div>
            <div>
              <label for="productType">产品类型 *</label>
              <select id="productType" name="productType" required>
                <option value="">请选择</option>
                <option value="烘焙">烘焙</option>
                <option value="蛋糕">蛋糕</option>
                <option value="三明治">三明治</option>
                <option value="预包装食品">预包装食品</option>
              </select>
            </div>
            <div>
              <label for="testCategory">测试类别 *</label>
              <input id="testCategory" name="testCategory" required autocomplete="off" placeholder="如：档期测试 / 新品提案">
            </div>
          </div>
        </div>

        <div class="section" data-mode-section="create">
          <p class="section-title">产品清单</p>
          <div class="product-list" id="productsContainer"></div>
          <div class="structure-tools" style="margin-top:12px;">
            <button class="ghost-button" id="addProductBtn" type="button">新增产品</button>
          </div>
        </div>

        <div class="section" data-mode-section="followup">
          <p class="section-title">第二段：补充测试反馈</p>
          <div class="grid two">
            <div>
              <label for="tastingScene">测试场景 / 反馈来源 *</label>
              <select id="tastingScene" name="tastingScene">
                <option value="">请选择</option>
                <option value="前期打磨测试">前期打磨测试</option>
                <option value="众测后优化">众测后优化</option>
                <option value="中试后优化">中试后优化</option>
                <option value="上市后优化">上市后优化</option>
              </select>
            </div>
            <div>
              <label for="roundConclusion">本轮结论 *</label>
              <select id="roundConclusion" name="roundConclusion">
                <option value="">请选择</option>
                <option value="继续调整">继续调整</option>
                <option value="暂停">暂停</option>
                <option value="通过且储备">通过且储备</option>
                <option value="通过且进入众测">通过且进入众测</option>
              </select>
            </div>
            <div class="grid two feedback-pair span-2">
            <div>
              <label for="tastingFeedback">测试反馈 *</label>
              <textarea id="tastingFeedback" name="tastingFeedback" placeholder="如现场已有 Peet's 反馈，可记录口头反馈；测试前可暂空。"></textarea>
            </div>
            <div>
              <label for="nextStepDirection">下一步改进方向 *</label>
              <textarea id="nextStepDirection" name="nextStepDirection" placeholder="只写需要供应商调整的方向，例如颜色、甜度、结构、克重、包装等。"></textarea>
            </div>
            </div>
          </div>
        </div>

        <div class="actions mobile-sticky-actions">
          <button class="primary" id="submitBtn" type="submit">提交</button>
        </div>
      </form>
      <div class="message" id="message"></div>
      <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle">
        <div class="confirm-body">
          <p class="confirm-title" id="confirmTitle">确认提交</p>
          <p class="confirm-copy" id="confirmCopy">请确认本次填写的信息真实、完整，并已完成提交前检查。提交后，Peet's 将在后台接收记录，用于后续产品评审与跟进。</p>
        </div>
        <div class="confirm-actions">
          <button id="confirmCancelBtn" type="button">返回修改</button>
          <button class="primary" id="confirmSubmitBtn" type="button">确认提交</button>
        </div>
      </dialog>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const TABLE_BUCKET = window.CATEGORYLAB_SUPABASE?.bucket || "supplier-feedback-images";
    const config = window.CATEGORYLAB_SUPABASE || {};
    const form = document.querySelector("#submissionForm");
    const message = document.querySelector("#message");
    const submitBtn = document.querySelector("#submitBtn");
    const confirmDialog = document.querySelector("#confirmDialog");
    const confirmCopy = document.querySelector("#confirmCopy");
    const confirmCancelBtn = document.querySelector("#confirmCancelBtn");
    const confirmSubmitBtn = document.querySelector("#confirmSubmitBtn");
    const productsContainer = document.querySelector("#productsContainer");
    const addProductBtn = document.querySelector("#addProductBtn");
    const modeButtons = [...document.querySelectorAll("[data-mode]")];
    const modeSections = [...document.querySelectorAll("[data-mode-section]")];
    const followupCodeSection = document.querySelector("[data-followup-code-section]");
    const followupSummary = document.querySelector("#followupSummary");
    const supabaseReady = Boolean(config.url && config.anonKey && window.supabase);
    const client = supabaseReady ? window.supabase.createClient(config.url, config.anonKey) : null;
    const PRODUCT_FIELD_NAMES = [
      "productName",
      "versionLabel",
      "quoteRmb",
      "finishedSpec",
      "versionChange",
      "coreIngredientsSellingPoints"
    ];
    let products = [];
    let currentMode = "create";
    let followupRecord = null;

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
    }

    function escapeAttr(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function field(name) {
      return form.elements[name];
    }

    function setRequired(name, required) {
      if (field(name)) field(name).required = required;
    }

    function numeric(value) {
      const parsed = Number(String(value || "").replace(/[^0-9.]/g, ""));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatWeight(value) {
      return Number(value || 0).toFixed(2).replace(/\.?0+$/, "");
    }

    function compactRecordSummary(record) {
      return [
        record?.product_name ? `品名：${record.product_name}` : "",
        record?.supplier_name ? `供应商：${record.supplier_name}` : "",
        record?.version_label ? `版本：${record.version_label}` : "",
        record?.sample_date ? `送样时间：${record.sample_date}` : ""
      ].filter(Boolean).join(" ｜ ");
    }

    function setMode(mode) {
      currentMode = mode === "followup" ? "followup" : "create";
      modeButtons.forEach(button => {
        button.setAttribute("aria-pressed", button.dataset.mode === currentMode ? "true" : "false");
      });
      modeSections.forEach(section => {
        const show = section.dataset.modeSection === currentMode;
        section.classList.toggle("hidden", !show);
      });
      followupCodeSection.classList.toggle("hidden", currentMode !== "followup");
      setRequired("supplierName", currentMode === "create");
      setRequired("sampleDate", currentMode === "create");
      setRequired("productType", currentMode === "create");
      setRequired("testCategory", currentMode === "create");
      setRequired("followupCode", currentMode === "followup");
      setRequired("tastingScene", currentMode === "followup");
      setRequired("roundConclusion", currentMode === "followup");
      setRequired("tastingFeedback", currentMode === "followup");
      setRequired("nextStepDirection", currentMode === "followup");
      syncModeFieldState();
      followupRecord = null;
      followupSummary.style.display = "none";
      followupSummary.textContent = "";
      submitBtn.textContent = currentMode === "followup" ? "提交测试反馈" : "提交";
      clearMessage();
    }

    function rowId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    }

    function newProduct() {
      return {
        id: rowId(),
        fields: {},
        structures: [{ id: rowId(), name: "", weight: "" }],
        files: []
      };
    }

    function productById(productId) {
      return products.find(product => product.id === productId);
    }

    function productCard(productId) {
      return productsContainer.querySelector(`[data-product-id="${CSS.escape(productId)}"]`);
    }

    function productValue(product, name) {
      return product.fields?.[name] || "";
    }

    function specWeight(product) {
      const match = String(productValue(product, "finishedSpec") || "").match(/(\d+(?:\.\d+)?)\s*g/i);
      return match ? Number(match[1]) : 0;
    }

    function structureTotal(product) {
      return (product.structures || []).reduce((sum, row) => sum + numeric(row.weight), 0);
    }

    function structureText(product) {
      const filledRows = (product.structures || [])
        .map(row => ({
          name: String(row.name || "").trim(),
          weight: numeric(row.weight)
        }))
        .filter(row => row.name || row.weight > 0);

      const lines = filledRows.map(row => {
        const weightText = row.weight > 0 ? ` ${formatWeight(row.weight)}g` : "";
        return `${row.name}${weightText}`.trim();
      });
      const total = filledRows.reduce((sum, row) => sum + row.weight, 0);
      if (total > 0) lines.push(`自动计算总克重：${formatWeight(total)}g`);
      return lines.join("\n");
    }

    function selectHtml(name, options, selected) {
      const opts = options.map(option => `<option value="${escapeAttr(option)}" ${option === selected ? "selected" : ""}>${escapeAttr(option || "请选择")}</option>`).join("");
      return `<select data-product-field="${escapeAttr(name)}">${opts}</select>`;
    }

    function syncModeFieldState() {
      const productDisabled = currentMode !== "create";
      productsContainer.querySelectorAll("input, select, textarea, button").forEach(control => {
        if (control.id === "addProductBtn") return;
        if (control.matches("[data-delete-product]") && products.length <= 1) {
          control.disabled = true;
          return;
        }
        control.disabled = productDisabled || (control.matches("[data-delete-product]") && products.length <= 1);
      });
      productsContainer.querySelectorAll("[data-product-required]").forEach(control => {
        control.required = currentMode === "create";
      });
      ["tastingScene", "roundConclusion", "tastingFeedback", "nextStepDirection"].forEach(name => {
        if (field(name)) field(name).disabled = currentMode !== "followup";
      });
    }

    function focusAndExplain(input, messageText) {
      if (input) {
        input.focus();
        if (input.setCustomValidity) {
          input.setCustomValidity(messageText);
          input.reportValidity();
          input.setCustomValidity("");
        }
      }
      throw new Error(messageText);
    }

    function requiredProductValue(card, fieldName, label, index) {
      const input = card.querySelector(`[data-product-field="${fieldName}"]`);
      if (!input || String(input.value || "").trim()) return;
      focusAndExplain(input, `请填写产品 ${index + 1} 的${label}。`);
    }

    function requiredProductStructure(card, index) {
      const inputs = [...card.querySelectorAll('[data-structure-field="name"]')];
      const hasStructure = inputs.some(input => String(input.value || "").trim());
      if (hasStructure) return;
      focusAndExplain(inputs[0], `请填写产品 ${index + 1} 的产品结构。`);
    }

    function requiredProductImages(product, card, index) {
      if ((product.files || []).length > 0) return;
      const input = card.querySelector("[data-product-images]");
      focusAndExplain(input, `请上传产品 ${index + 1} 的产品照。`);
    }

    function validateProducts() {
      for (const [index, product] of products.entries()) {
        const card = productCard(product.id);
        if (!card) continue;
        requiredProductValue(card, "productName", "品名", index);
        requiredProductValue(card, "versionLabel", "版本", index);
        requiredProductValue(card, "quoteRmb", "报价", index);
        requiredProductValue(card, "finishedSpec", "成品规格", index);
        requiredProductValue(card, "versionChange", "本版调整点", index);
        requiredProductValue(card, "coreIngredientsSellingPoints", "核心原料及卖点", index);
        requiredProductStructure(card, index);
        requiredProductImages(product, card, index);
      }
    }

    function validateFollowup() {
      const required = [
        ["followupCode", "提交编号"],
        ["tastingScene", "测试场景 / 反馈来源"],
        ["roundConclusion", "本轮结论"],
        ["tastingFeedback", "测试反馈"],
        ["nextStepDirection", "下一步改进方向"]
      ];
      for (const [name, label] of required) {
        const input = field(name);
        if (!String(input?.value || "").trim()) focusAndExplain(input, `请填写${label}。`);
      }
    }

    function hasExistingFollowupFeedback(record) {
      return ["tasting_scene", "tasting_feedback", "round_conclusion", "next_step_direction"]
        .some(name => String(record?.[name] || "").trim());
    }

    function confirmationCopyForMode(mode, record) {
      if (mode !== "followup") {
        return "请确认本次填写的产品资料真实、完整，并已完成提交前检查。提交后，Peet's 将在后台接收记录，用于后续产品评审与跟进。";
      }
      if (hasExistingFollowupFeedback(record)) {
        return "该提交编号对应的记录已填写过测试反馈。当前内容提交后，将覆盖原有测试场景、测试反馈、本轮结论和下一步改进方向。请确认是否继续提交。";
      }
      return "请确认本次补充的测试反馈、结论及下一步改进方向准确无误。提交后，系统将把反馈合并至对应产品记录，用于后续产品评审与跟进。";
    }

    function confirmSubmission() {
      const copy = confirmationCopyForMode(currentMode, currentMode === "followup" ? followupRecord : null);
      if (confirmCopy) confirmCopy.textContent = copy;
      if (!confirmDialog?.showModal) {
        return Promise.resolve(window.confirm(`确认提交\n\n${copy}`));
      }
      return new Promise(resolve => {
        const cleanup = () => {
          confirmCancelBtn.removeEventListener("click", onCancel);
          confirmSubmitBtn.removeEventListener("click", onSubmit);
          confirmDialog.removeEventListener("cancel", onCancel);
        };
        const close = value => {
          cleanup();
          if (confirmDialog.open) confirmDialog.close();
          resolve(value);
        };
        const onCancel = event => {
          event.preventDefault();
          close(false);
        };
        const onSubmit = () => close(true);
        confirmCancelBtn.addEventListener("click", onCancel);
        confirmSubmitBtn.addEventListener("click", onSubmit);
        confirmDialog.addEventListener("cancel", onCancel);
        confirmDialog.showModal();
      });
    }

    function productStructureRows(product) {
      return (product.structures || []).map(row => `
        <tr data-structure-id="${escapeAttr(row.id)}">
          <td><input data-structure-field="name" value="${escapeAttr(row.name || "")}" placeholder="如：胚体、奶油、鸡肉、酱料"></td>
          <td><input data-structure-field="weight" value="${escapeAttr(row.weight || "")}" inputmode="decimal" placeholder="可不填"></td>
          <td><button class="ghost-button danger" data-delete-structure="${escapeAttr(row.id)}" type="button">删除</button></td>
        </tr>
      `).join("");
    }

    function productHtml(product, index) {
      const canDelete = products.length > 1;
      return `
        <article class="product-card" data-product-id="${escapeAttr(product.id)}">
          <div class="product-card-header">
            <p class="product-title">产品 ${index + 1}</p>
            <button class="ghost-button danger" data-delete-product="${escapeAttr(product.id)}" type="button" ${canDelete ? "" : "disabled"}>删除产品</button>
          </div>

          <div class="product-fields">
            <div class="grid product-main">
            <div>
              <label>品名 *</label>
              <input data-product-field="productName" data-product-required autocomplete="off" required value="${escapeAttr(productValue(product, "productName"))}" placeholder="如：香蕉布朗尼千层蛋糕">
            </div>
            <div>
              <label>版本 *</label>
              <input data-product-field="versionLabel" data-product-required required value="${escapeAttr(productValue(product, "versionLabel"))}" placeholder="V1 / V2 / V3">
            </div>
            <div>
              <label>报价（元，含税含运） *</label>
              <input data-product-field="quoteRmb" data-product-required required inputmode="decimal" value="${escapeAttr(productValue(product, "quoteRmb"))}" placeholder="确认配方后填写">
            </div>
            <div>
              <label>成品规格（克） *</label>
              <input data-product-field="finishedSpec" data-product-required required value="${escapeAttr(productValue(product, "finishedSpec"))}" placeholder="如：165g/份">
            </div>
            </div>
            <div class="grid two product-notes">
            <div>
              <label>本版调整点 *</label>
              <textarea data-product-field="versionChange" data-product-required required placeholder="本版相较上一版改了什么；首版请写本次验证重点。">${escapeAttr(productValue(product, "versionChange"))}</textarea>
            </div>
            <div>
              <label>核心原料及卖点 *</label>
              <textarea data-product-field="coreIngredientsSellingPoints" data-product-required required placeholder="核心原料、关键卖点或产品亮点。">${escapeAttr(productValue(product, "coreIngredientsSellingPoints"))}</textarea>
            </div>
            </div>
            <div class="span-3">
              <label>产品结构 *</label>
              <div class="structure-builder">
                <div class="structure-tools">
                  <button class="ghost-button" data-add-structure="${escapeAttr(product.id)}" type="button">新增产品结构</button>
                  <span class="weight-summary" data-total-weight>自动计算克重：0g</span>
                </div>
                <table class="structure-table" aria-label="产品结构明细">
                  <thead>
                    <tr>
                      <th>描述</th>
                      <th class="weight-cell">重量(g)</th>
                      <th class="action-cell">操作</th>
                    </tr>
                  </thead>
                  <tbody>${productStructureRows(product)}</tbody>
                </table>
              </div>
              <textarea data-product-field="ingredientsStructure" hidden></textarea>
              <p class="spec-compare" data-spec-compare>可写胚体、奶油、鸡肉、酱料等；蛋糕可不标克重，但分层结构要写清楚。</p>
            </div>
            <div class="span-3">
              <label>产品照 *</label>
              <input data-product-images type="file" accept="image/*" multiple>
              <p class="field-note">每个产品最多 6 张，系统会压缩后上传。</p>
              <div class="preview-grid" data-image-preview></div>
            </div>
          </div>
        </article>
      `;
    }

    function syncProductFromCard(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      if (!product || !card) return;
      PRODUCT_FIELD_NAMES.forEach(name => {
        const input = card.querySelector(`[data-product-field="${name}"]`);
        if (input) product.fields[name] = input.value;
      });
      product.structures = [...card.querySelectorAll("[data-structure-id]")].map(row => ({
        id: row.dataset.structureId,
        name: row.querySelector('[data-structure-field="name"]')?.value || "",
        weight: row.querySelector('[data-structure-field="weight"]')?.value || ""
      }));
      if (!product.structures.length) product.structures = [{ id: rowId(), name: "", weight: "" }];
    }

    function syncAllProducts() {
      products.forEach(product => syncProductFromCard(product.id));
    }

    function updateProductSummary(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      if (!product || !card) return;
      const total = structureTotal(product);
      const structureField = card.querySelector('[data-product-field="ingredientsStructure"]');
      const totalWeightText = card.querySelector("[data-total-weight]");
      const specCompareText = card.querySelector("[data-spec-compare]");
      if (structureField) structureField.value = structureText(product);
      if (totalWeightText) totalWeightText.textContent = `自动计算克重：${formatWeight(total)}g`;
      const spec = specWeight(product);
      if (!spec || !total) {
        if (specCompareText) specCompareText.textContent = "可写胚体、奶油、鸡肉、酱料等；蛋糕可不标克重，但分层结构要写清楚。";
        return;
      }
      const diff = total - spec;
      const sign = diff > 0 ? "+" : "";
      if (specCompareText) specCompareText.textContent = `成品规格 ${formatWeight(spec)}g；当前明细合计 ${formatWeight(total)}g；差异 ${sign}${formatWeight(diff)}g。`;
    }

    function renderProductPreview(productId) {
      const product = productById(productId);
      const card = productCard(productId);
      const preview = card?.querySelector("[data-image-preview]");
      if (!product || !preview) return;
      preview.innerHTML = (product.files || []).slice(0, 6).map((file, index) => `
        <figure>
          <img src="${URL.createObjectURL(file)}" alt="待上传产品照 ${index + 1}">
          <figcaption>${escapeAttr(file.name)}</figcaption>
        </figure>
      `).join("");
    }

    function renderProducts() {
      productsContainer.innerHTML = products.map(productHtml).join("");
      products.forEach(product => {
        updateProductSummary(product.id);
        renderProductPreview(product.id);
      });
      syncModeFieldState();
    }

    function productPayload(product, imagePaths = []) {
      const sharedSupplier = field("supplierName").value.trim();
      const sharedDate = field("sampleDate").value;
      const sharedProductType = field("productType").value;
      const sharedTestCategory = field("testCategory").value.trim();
      return {
        product_name: productValue(product, "productName").trim(),
        supplier_name: sharedSupplier,
        version_label: productValue(product, "versionLabel").trim(),
        sample_date: sharedDate,
        product_type: sharedProductType,
        test_category: sharedTestCategory,
        version_change: productValue(product, "versionChange").trim(),
        finished_spec: productValue(product, "finishedSpec").trim(),
        ingredients_structure: structureText(product).trim(),
        image_paths: imagePaths,
        quote_rmb: productValue(product, "quoteRmb").trim(),
        core_ingredients_selling_points: productValue(product, "coreIngredientsSellingPoints").trim()
      };
    }

    function feedbackPayload() {
      return {
        tasting_scene: field("tastingScene").value,
        tasting_feedback: field("tastingFeedback").value.trim(),
        round_conclusion: field("roundConclusion").value,
        next_step_direction: field("nextStepDirection").value.trim()
      };
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file) {
      const rawDataUrl = await fileToImage(file);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("图片无法读取，请使用 JPG、PNG 或 WebP 格式。"));
        img.src = rawDataUrl;
      });

      const maxSide = 1400;
      const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.78));
      return blob || file;
    }

    async function uploadImages(recordId, files, existingImages = []) {
      files = [...(files || [])].slice(0, 6);
      if (!files.length) return existingImages;
      const uploaded = [];
      for (const [index, file] of files.entries()) {
        const blob = await compressImage(file);
        const path = `supplier-feedback/${recordId}/${Date.now()}-${index + 1}.jpg`;
        const { error } = await client.storage
          .from(TABLE_BUCKET)
          .upload(path, blob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
        if (error) throw error;
        const { data } = client.storage.from(TABLE_BUCKET).getPublicUrl(path);
        uploaded.push({
          path,
          publicUrl: data.publicUrl,
          name: file.name,
          type: "image/jpeg",
          size: blob.size || file.size || 0
        });
      }
      return [...existingImages, ...uploaded].slice(0, 6);
    }

    function friendlyError(error) {
      const text = error?.message || String(error || "");
      if (text.includes("Failed to fetch")) return "网络请求失败。请先确认网络可以访问 Supabase；如果刚才上传了图片，请先去掉图片再提交一次。";
      if (text.includes("品名不能为空") || text.includes("供应商不能为空")) return text;
      if (text.includes("提交编号不存在")) return "提交编号不存在，请检查第一段提交成功后显示的编号。";
      return text || "提交失败。";
    }

    async function loadFollowupRecord() {
      const code = field("followupCode").value.trim().toUpperCase();
      if (!code) return null;
      const { data, error } = await client.rpc("get_supplier_feedback_by_followup_code", {
        p_followup_code: code
      });
      if (error) throw error;
      followupRecord = data || null;
      followupSummary.style.display = followupRecord ? "block" : "none";
      followupSummary.textContent = followupRecord ? compactRecordSummary(followupRecord) : "";
      return followupRecord;
    }

    async function submitFollowup() {
      validateFollowup();
      const code = field("followupCode").value.trim().toUpperCase();
      if (!code) throw new Error("请填写提交编号。");
      const { data, error } = await client.rpc("complete_supplier_feedback", {
        p_followup_code: code,
        p_payload: feedbackPayload()
      });
      if (error) throw error;
      followupRecord = data;
      return data;
    }

    async function submitCreate() {
      syncAllProducts();
      validateProducts();
      const payloads = products.map((product, index) => ({ product, index, payload: productPayload(product, []) }));
      const missing = payloads.find(item => !item.payload.product_name || !item.payload.version_label);
      if (missing) throw new Error(`请填写产品 ${missing.index + 1} 的品名和版本。`);
      if (!payloads.length) throw new Error("请至少填写一个产品。");

      const results = [];
      for (const item of payloads) {
        const { data, error } = await client.rpc("submit_supplier_feedback", {
          p_payload: item.payload
        });
        if (error) throw error;
        let imageWarning = "";
        try {
          const images = await uploadImages(data.id, item.product.files, []);
          if (images.length) {
            const { error: updateError } = await client.rpc("update_supplier_feedback", {
              p_id: data.id,
              p_edit_token: data.edit_token,
              p_payload: productPayload(item.product, images)
            });
            if (updateError) throw updateError;
          }
        } catch (error) {
          imageWarning = `图片没有上传成功：${friendlyError(error)}。基础信息已收到，图片可后续补充给 Peet's。`;
        }
        results.push({
          id: data.id,
          productName: item.payload.product_name,
          followupCode: data.record?.followup_code || "",
          imageWarning
        });
      }
      return results;
    }

    async function resetFormAfterSubmit() {
      form.reset();
      products = [newProduct()];
      renderProducts();
      followupSummary.style.display = "none";
      followupSummary.textContent = "";
      followupRecord = null;
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });
    addProductBtn.addEventListener("click", () => {
      syncAllProducts();
      const product = newProduct();
      products.push(product);
      renderProducts();
      productCard(product.id)?.querySelector('[data-product-field="productName"]')?.focus();
    });
    productsContainer.addEventListener("input", event => {
      const card = event.target.closest("[data-product-id]");
      if (!card) return;
      syncProductFromCard(card.dataset.productId);
      updateProductSummary(card.dataset.productId);
    });
    productsContainer.addEventListener("change", event => {
      const card = event.target.closest("[data-product-id]");
      if (!card) return;
      const product = productById(card.dataset.productId);
      if (event.target.matches("[data-product-images]") && product) {
        product.files = [...event.target.files].slice(0, 6);
        renderProductPreview(product.id);
        if (event.target.files.length > 6) showMessage("每个产品最多上传 6 张图片，本次只会提交前 6 张。");
        return;
      }
      syncProductFromCard(card.dataset.productId);
      updateProductSummary(card.dataset.productId);
    });
    productsContainer.addEventListener("click", event => {
      const addStructure = event.target.closest("[data-add-structure]");
      const deleteStructure = event.target.closest("[data-delete-structure]");
      const deleteProduct = event.target.closest("[data-delete-product]");
      if (addStructure) {
        syncAllProducts();
        const product = productById(addStructure.dataset.addStructure);
        if (product) product.structures.push({ id: rowId(), name: "", weight: "" });
        renderProducts();
        return;
      }
      if (deleteStructure) {
        const card = deleteStructure.closest("[data-product-id]");
        syncAllProducts();
        const product = productById(card?.dataset.productId);
        if (product) {
          product.structures = product.structures.filter(row => row.id !== deleteStructure.dataset.deleteStructure);
          if (!product.structures.length) product.structures.push({ id: rowId(), name: "", weight: "" });
        }
        renderProducts();
        return;
      }
      if (deleteProduct && products.length > 1) {
        syncAllProducts();
        products = products.filter(product => product.id !== deleteProduct.dataset.deleteProduct);
        renderProducts();
      }
    });
    field("followupCode").addEventListener("blur", async () => {
      if (currentMode !== "followup" || !field("followupCode").value.trim() || !supabaseReady) return;
      try {
        await loadFollowupRecord();
      } catch (error) {
        followupSummary.style.display = "none";
        followupSummary.textContent = "";
        showMessage(friendlyError(error), "error");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!supabaseReady) {
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      if (!form.reportValidity()) return;
      try {
        if (currentMode === "followup") {
          validateFollowup();
          await loadFollowupRecord();
        } else {
          syncAllProducts();
          validateProducts();
        }
        const confirmed = await confirmSubmission();
        if (!confirmed) return;
        submitBtn.disabled = true;
        submitBtn.textContent = "提交中...";
        if (currentMode === "followup") {
          const record = await submitFollowup();
          await resetFormAfterSubmit();
          setMode("followup");
          showMessage(`测试反馈已补充，系统已合并到原记录。\n${compactRecordSummary(record)}`, "success");
        } else {
          const results = await submitCreate();
          await resetFormAfterSubmit();
          const codeText = results.map((result, index) => `产品 ${index + 1}：${result.productName}${result.followupCode ? `｜提交编号：${result.followupCode}` : ""}`).join("\n");
          const warnings = results.map(result => result.imageWarning).filter(Boolean);
          const warningText = warnings.length ? `\n\n${warnings.join("\n")}` : "";
          showMessage(`已提交 ${results.length} 个产品，Peet's 会在后台确认。\n${codeText}\n测试后补充测试反馈时，请使用对应产品的提交编号。${warningText}`, warnings.length ? "error" : "success");
        }
      } catch (error) {
        showMessage(friendlyError(error), "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentMode === "followup" ? "提交测试反馈" : "提交";
      }
    });

    products = [newProduct()];
    renderProducts();
    setMode("create");
    if (!supabaseReady) {
      showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
