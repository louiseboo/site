<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>供应商送样信息提交</title>
  <style>
    :root {
      --paper: #f7f3ea;
      --panel: #fffdf8;
      --line: #d7c7ad;
      --ink: #1d1a16;
      --muted: #756b5d;
      --accent: #1f6f5b;
      --danger: #b23b28;
      --shadow: 0 16px 42px rgba(34, 28, 18, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .status-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 253, 248, 0.72);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    form { padding: 22px; }
    .section {
      padding: 20px 0;
      border-top: 1px solid #eadfce;
    }
    .section:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 900;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #3e352b;
      font-size: 13px;
      font-weight: 900;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 10px 11px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #b18a47;
      box-shadow: 0 0 0 3px rgba(177, 138, 71, 0.16);
    }
    textarea {
      min-height: 98px;
      resize: vertical;
    }
    .field-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .preview-grid figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .preview-grid img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f1eadf;
    }
    .preview-grid figcaption {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid #eadfce;
    }
    button, .link-button {
      appearance: none;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      padding: 9px 14px;
      text-decoration: none;
    }
    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }
    .message {
      display: none;
      margin: 0 22px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: #fff;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.error {
      border-color: rgba(178, 59, 40, 0.42);
      background: #fff8f6;
      color: var(--danger);
    }
    .message.success {
      border-color: rgba(31, 111, 91, 0.42);
      background: #f6fffb;
      color: var(--accent);
    }
    @media (max-width: 760px) {
      main {
        width: min(100vw - 22px, 1040px);
        padding-top: 18px;
      }
      header { display: block; }
      .status-pill {
        display: inline-block;
        margin-top: 12px;
      }
      form { padding: 16px; }
      .grid, .grid.two { grid-template-columns: 1fr; }
      .span-2, .span-3 { grid-column: auto; }
      .actions { justify-content: stretch; }
      button, .link-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Category Lab Supplier Form</p>
        <h1>供应商送样信息提交</h1>
      </div>
      <div class="status-pill" id="modePill">新增提交</div>
    </header>

    <section class="panel">
      <form id="submissionForm">
        <div class="section">
          <p class="section-title">送样基础信息</p>
          <div class="grid">
            <div>
              <label for="productName">品名 *</label>
              <input id="productName" name="productName" required autocomplete="off" placeholder="如：香蕉布朗尼千层蛋糕">
            </div>
            <div>
              <label for="supplierName">供应商 *</label>
              <input id="supplierName" name="supplierName" list="supplierList" required autocomplete="organization" placeholder="供应商公司简称">
              <datalist id="supplierList">
                <option value="怡安"></option>
              </datalist>
            </div>
            <div>
              <label for="versionLabel">版本 *</label>
              <input id="versionLabel" name="versionLabel" required placeholder="V1 / V2 / V3">
              <p class="field-note">按打样顺序编号，每次调整顺延。</p>
            </div>
            <div>
              <label for="sampleDate">送样时间 *</label>
              <input id="sampleDate" name="sampleDate" type="date" required>
            </div>
            <div>
              <label for="quoteRmb">报价（元）</label>
              <input id="quoteRmb" name="quoteRmb" inputmode="decimal" placeholder="确认配方后填写含税出厂价">
            </div>
            <div>
              <label for="finishedSpec">成品规格</label>
              <input id="finishedSpec" name="finishedSpec" placeholder="如：165g/袋、180g/份">
            </div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">产品说明</p>
          <div class="grid two">
            <div>
              <label for="versionChange">本版调整点</label>
              <textarea id="versionChange" name="versionChange" placeholder="本版相较上一版改了什么；首版请写本次验证重点。"></textarea>
            </div>
            <div>
              <label for="coreIngredientsSellingPoints">核心原料及卖点</label>
              <textarea id="coreIngredientsSellingPoints" name="coreIngredientsSellingPoints" placeholder="已确定时填写；未确定可暂空。"></textarea>
            </div>
            <div class="span-2">
              <label for="ingredientsStructure">配料 / 结构</label>
              <textarea id="ingredientsStructure" name="ingredientsStructure" placeholder="按从下到上、从外到内，写清坯体、夹心、酱料、装饰和克重。"></textarea>
            </div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">产品照</p>
          <input id="images" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          <p class="field-note">最多 6 张，系统会压缩后上传。</p>
          <div class="preview-grid" id="imagePreview"></div>
        </div>

        <div class="actions">
          <a class="link-button" href="/decks/category-lab/categorylab">返回 Category Lab</a>
          <button class="primary" id="submitBtn" type="submit">提交</button>
        </div>
      </form>
      <div class="message" id="message"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const TABLE_BUCKET = window.CATEGORYLAB_SUPABASE?.bucket || "supplier-feedback-images";
    const config = window.CATEGORYLAB_SUPABASE || {};
    const form = document.querySelector("#submissionForm");
    const message = document.querySelector("#message");
    const submitBtn = document.querySelector("#submitBtn");
    const modePill = document.querySelector("#modePill");
    const imageInput = document.querySelector("#images");
    const imagePreview = document.querySelector("#imagePreview");
    const params = new URLSearchParams(window.location.search);
    const editId = params.get("id") || params.get("edit") || "";
    const editToken = params.get("token") || "";
    const supabaseReady = Boolean(config.url && config.anonKey && window.supabase);
    const client = supabaseReady ? window.supabase.createClient(config.url, config.anonKey) : null;
    let currentImages = [];

    function showMessage(text, type = "") {
      message.className = `message show ${type}`.trim();
      message.textContent = text;
    }

    function escapeAttr(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function field(name) {
      return form.elements[name];
    }

    function setField(name, value) {
      if (field(name)) field(name).value = value || "";
    }

    function formPayload(imagePaths = currentImages) {
      return {
        product_name: field("productName").value.trim(),
        supplier_name: field("supplierName").value.trim(),
        version_label: field("versionLabel").value.trim(),
        sample_date: field("sampleDate").value,
        version_change: field("versionChange").value.trim(),
        finished_spec: field("finishedSpec").value.trim(),
        ingredients_structure: field("ingredientsStructure").value.trim(),
        image_paths: imagePaths,
        quote_rmb: field("quoteRmb").value.trim(),
        core_ingredients_selling_points: field("coreIngredientsSellingPoints").value.trim()
      };
    }

    function fillForm(row) {
      setField("productName", row.product_name);
      setField("supplierName", row.supplier_name);
      setField("versionLabel", row.version_label);
      setField("sampleDate", row.sample_date);
      setField("versionChange", row.version_change);
      setField("finishedSpec", row.finished_spec);
      setField("ingredientsStructure", row.ingredients_structure);
      setField("quoteRmb", row.quote_rmb);
      setField("coreIngredientsSellingPoints", row.core_ingredients_selling_points);
      currentImages = Array.isArray(row.image_paths) ? row.image_paths : [];
      renderImages(currentImages);
    }

    function renderImages(images) {
      imagePreview.innerHTML = (images || []).map((image, index) => `
        <figure>
          <img src="${escapeAttr(image.publicUrl || image.url || "")}" alt="产品照 ${index + 1}">
          <figcaption>${escapeAttr(image.name || `产品照 ${index + 1}`)}</figcaption>
        </figure>
      `).join("");
    }

    function renderSelectedFiles() {
      const files = [...imageInput.files].slice(0, 6);
      imagePreview.innerHTML = files.map((file, index) => `
        <figure>
          <img src="${URL.createObjectURL(file)}" alt="待上传产品照 ${index + 1}">
          <figcaption>${escapeAttr(file.name)}</figcaption>
        </figure>
      `).join("");
      if (imageInput.files.length > 6) showMessage("最多上传 6 张图片，本次只会提交前 6 张。");
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file) {
      const rawDataUrl = await fileToImage(file);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = rawDataUrl;
      });

      const maxSide = 1400;
      const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.78));
      return blob || file;
    }

    async function uploadImages(recordId, existingImages = []) {
      const files = [...imageInput.files].slice(0, 6);
      if (!files.length) return existingImages;
      const uploaded = [];
      for (const [index, file] of files.entries()) {
        const blob = await compressImage(file);
        const path = `supplier-feedback/${recordId}/${Date.now()}-${index + 1}.jpg`;
        const { error } = await client.storage
          .from(TABLE_BUCKET)
          .upload(path, blob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
        if (error) throw error;
        const { data } = client.storage.from(TABLE_BUCKET).getPublicUrl(path);
        uploaded.push({
          path,
          publicUrl: data.publicUrl,
          name: file.name,
          type: "image/jpeg",
          size: blob.size || file.size || 0
        });
      }
      return [...existingImages, ...uploaded].slice(0, 6);
    }

    async function loadEditRecord() {
      if (!editId || !editToken) return;
      modePill.textContent = "修改提交";
      submitBtn.textContent = "保存修改";
      const { data, error } = await client.rpc("get_supplier_feedback_for_edit", {
        p_id: editId,
        p_edit_token: editToken
      });
      if (error) throw error;
      fillForm(data);
    }

    function editUrl(id, token) {
      return `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;
    }

    async function submitCreate() {
      const { data, error } = await client.rpc("submit_supplier_feedback", {
        p_payload: formPayload([])
      });
      if (error) throw error;
      const images = await uploadImages(data.id, []);
      if (images.length) {
        const { data: updated, error: updateError } = await client.rpc("update_supplier_feedback", {
          p_id: data.id,
          p_edit_token: data.edit_token,
          p_payload: formPayload(images)
        });
        if (updateError) throw updateError;
        fillForm(updated);
      } else {
        fillForm(data.record);
      }
      return { id: data.id, token: data.edit_token };
    }

    async function submitUpdate() {
      const images = await uploadImages(editId, currentImages);
      const { data, error } = await client.rpc("update_supplier_feedback", {
        p_id: editId,
        p_edit_token: editToken,
        p_payload: formPayload(images)
      });
      if (error) throw error;
      fillForm(data);
      return { id: editId, token: editToken };
    }

    imageInput.addEventListener("change", renderSelectedFiles);

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!supabaseReady) {
        showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
        return;
      }
      if (!form.reportValidity()) return;
      submitBtn.disabled = true;
      submitBtn.textContent = editId ? "保存中..." : "提交中...";
      try {
        const result = editId && editToken ? await submitUpdate() : await submitCreate();
        const link = editUrl(result.id, result.token);
        await navigator.clipboard?.writeText(link).catch(() => {});
        imageInput.value = "";
        showMessage(`已提交。\n\n修改链接：\n${link}`, "success");
      } catch (error) {
        showMessage(error.message || "提交失败。", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? "保存修改" : "提交";
      }
    });

    if (!supabaseReady) {
      showMessage("Supabase 尚未配置。请先填写 supabase-config.js。", "error");
    } else {
      loadEditRecord().catch(error => showMessage(error.message || "无法加载记录。", "error"));
    }
  </script>
</body>
</html>
